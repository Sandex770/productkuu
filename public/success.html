<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pembayaran Berhasil - ProductKuu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&family=Archivo+Black&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
:root,[data-theme="light"]{--bg:#F4F1E8;--bg-grid:rgba(0,0,0,.055);--surface:#FFF;--surface-2:#FAF8F0;--ink:#0A0A0A;--ink-muted:#4A4A4A;--ink-soft:#7A7A7A;--lime:#C4F000;--lime-deep:#9BC400;--amber:#FFC400;--amber-deep:#D9A300;--blue:#2B6FFF;--blue-deep:#1E4FCC;--blue-soft:#E6EEFF;--border:#0A0A0A;--border-width:2px;--shadow-color:#0A0A0A;--shadow-x:4px;--shadow-y:4px;--grid-line:rgba(0,0,0,.08);--nav-bg:#F4F1E8}
[data-theme="dark"]{--bg:#0B0B0D;--bg-grid:rgba(255,255,255,.045);--surface:#16161A;--surface-2:#1E1E24;--ink:#F5F3EC;--ink-muted:#B8B8C0;--ink-soft:#8A8A92;--lime:#C4F000;--lime-deep:#A8D400;--amber:#FFC400;--amber-deep:#E0AC00;--blue:#4D8BFF;--blue-deep:#2B6FFF;--blue-soft:#1A2540;--border:#F5F3EC;--border-width:2px;--shadow-color:#F5F3EC;--shadow-x:4px;--shadow-y:4px;--grid-line:rgba(255,255,255,.06);--nav-bg:#0B0B0D}
*{scroll-behavior:smooth;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background-color:var(--bg);color:var(--ink);margin:0;line-height:1.6;overflow-x:hidden;transition:background-color .35s ease,color .35s ease;background-image:linear-gradient(to right,var(--grid-line) 1px,transparent 1px),linear-gradient(to bottom,var(--grid-line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
.font-mono-tag{font-family:'Space Mono',monospace,sans-serif}
.font-display{font-family:'Archivo Black','Inter',sans-serif;letter-spacing:-.02em}
.neo-tag{display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:#0A0A0A;font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.9px;padding:6px 14px;border:var(--border-width) solid var(--border);box-shadow:3px 3px 0 var(--shadow-color);font-family:'Space Mono',monospace}
.neo-tag.blue{background:var(--blue);color:#FFF}
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;height:76px;background:var(--nav-bg);border-bottom:var(--border-width) solid var(--border);transition:transform .25s ease,box-shadow .25s ease,background .35s,border-color .35s}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.6px;padding:12px 22px;border:var(--border-width) solid var(--border);border-radius:0;cursor:pointer;text-decoration:none;transition:all .09s;white-space:nowrap}
.btn-primary{background:var(--lime);color:#0A0A0A;box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--shadow-color)}
.btn-primary:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--shadow-color);background:var(--amber)}
.btn-secondary{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--shadow-color)}
.btn-secondary:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--blue);border-color:var(--blue);color:var(--blue)}
.spinner{animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body data-theme="light">

<nav class="navbar">
<div class="max-w-7xl mx-auto px-4 sm:px-6 h-full flex items-center justify-between gap-3">
    <a class="text-xl sm:text-2xl font-black tracking-tight flex items-center gap-2 shrink-0" href="/">
        <span class="bg-[var(--lime)] text-[#0A0A0A] px-2.5 py-1 border-2 border-[var(--border)] font-black shadow-[2px_2px_0px_var(--shadow-color)]">Product</span>
        <span class="text-[var(--ink)] font-black">Kuu</span>
    </a>
    <div class="flex items-center gap-2.5">
        <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema"><span class="material-symbols-outlined icon-sun">light_mode</span><span class="material-symbols-outlined icon-moon">dark_mode</span></button>
        <a href="/" class="btn btn-secondary !py-2 !px-3.5">Beranda</a>
    </div>
</div>
</nav>

<main class="pt-32 pb-20">
<div class="max-w-3xl mx-auto px-4 sm:px-6">
    <div class="text-center mb-10">
        <span class="material-symbols-outlined text-6xl text-[var(--lime-deep)] mb-4">check_circle</span>
        <h1 class="font-display text-4xl text-[var(--ink)]">Pembayaran Berhasil!</h1>
        <p class="text-[var(--ink-muted)] font-bold mt-2">Terima kasih telah berbelanja di ProductKuu.</p>
    </div>

    <div id="deliveryContent" class="space-y-6">
        <div class="text-center py-10">
            <span class="material-symbols-outlined spinner text-4xl text-[var(--blue)]">refresh</span>
            <p class="font-bold mt-4">Menyiapkan akun Anda...</p>
        </div>
    </div>

    <div class="mt-10 flex justify-center">
        <a href="/" class="btn btn-primary">Kembali ke Beranda</a>
    </div>
</div>
</main>

<script>
// THEME
(function() { const saved = localStorage.getItem('pk-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); })();
document.getElementById('themeToggle')?.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); document.body.setAttribute('data-theme', next); localStorage.setItem('pk-theme', next);
});

const urlParams = new URLSearchParams(window.location.search);
const orderId = urlParams.get('order');

function formatPrice(p) { return new Intl.NumberFormat('id-ID').format(p || 0); }

async function loadDelivery() {
    const container = document.getElementById('deliveryContent');
    if(!orderId) { container.innerHTML = '<p class="text-center text-red-500 font-bold">Order ID tidak ditemukan.</p>'; return; }

    try {
        const res = await fetch(`/api/orders/${orderId}/delivery`);
        const data = await res.json();

        if(!res.ok) { container.innerHTML = `<p class="text-center text-red-500 font-bold">${data.error}</p>`; return; }

        const { order, delivery } = data;

        let itemsHtml = delivery.map(item => {
            let accountHtml = '';
            if(item.accounts && item.accounts.length > 0) {
                accountHtml = item.accounts.map((acc, i) => `
                    <div class="bg-[var(--bg)] border-2 border-[var(--border)] p-4 mt-3 shadow-[2px_2px_0px_var(--shadow-color)]">
                        <div class="text-xs font-black text-[var(--blue)] uppercase mb-2">Akun #${i+1}</div>
                        <div class="font-mono-tag text-sm mb-1"><span class="font-bold">Email:</span> <span class="select-all">${acc.email}</span></div>
                        <div class="font-mono-tag text-sm"><span class="font-bold">Password:</span> <span class="select-all text-[var(--blue)]">${acc.password}</span></div>
                    </div>
                `).join('');
            } else if (item.downloadLink) {
                accountHtml = `<div class="mt-4"><a href="${item.downloadLink}" target="_blank" class="btn btn-primary w-full !py-3"><i class="fas fa-download"></i> Download Produk</a></div>`;
            }

            return `
                <div class="bg-[var(--surface)] border-2 border-[var(--border)] p-6 shadow-[4px_4px_0px_var(--shadow-color)] mb-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2 border-b-2 border-dashed border-[var(--ink-soft)] pb-3">
                        <div>
                            <div class="font-black text-xl">${item.name}</div>
                            <div class="text-sm font-bold text-[var(--ink-muted)]">Jumlah: ${item.qty}</div>
                        </div>
                        <div class="font-black text-[var(--blue)] text-lg font-mono-tag">Rp${formatPrice(item.price * item.qty)}</div>
                    </div>
                    ${accountHtml}
                </div>
            `;
        }).join('');

        container.innerHTML = `
            <div class="bg-[var(--surface)] border-2 border-[var(--border)] p-6 shadow-[4px_4px_0px_var(--shadow-color)] mb-8">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><div class="text-xs font-black text-[var(--ink-muted)] uppercase">Order ID</div><div class="font-mono-tag font-bold text-lg text-[var(--ink)]">${order.id}</div></div>
                    <div><div class="text-xs font-black text-[var(--ink-muted)] uppercase">Nama Pembeli</div><div class="font-bold text-lg text-[var(--ink)]">${order.buyerName}</div></div>
                </div>
            </div>
            <h3 class="font-display text-2xl mb-4 border-b-2 border-dashed border-[var(--ink-soft)] pb-2">Data Pembelian</h3>
            ${itemsHtml}
        `;
    } catch(e) { container.innerHTML = `<p class="text-center text-red-500 font-bold">Gagal memuat data: ${e.message}</p>`; }
}
document.addEventListener('DOMContentLoaded', loadDelivery);
</script>
</body>
</html>
