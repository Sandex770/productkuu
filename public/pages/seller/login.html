<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Seller - ProductKuu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&family=Archivo+Black&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
:root,[data-theme="light"]{--bg:#F4F1E8;--surface:#FFF;--ink:#0A0A0A;--ink-muted:#4A4A4A;--lime:#C4F000;--amber:#FFC400;--blue:#2B6FFF;--border:#0A0A0A;--shadow-color:#0A0A0A;--grid-line:rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0B0B0D;--surface:#16161A;--ink:#F5F3EC;--ink-muted:#B8B8C0;--lime:#C4F000;--amber:#FFC400;--blue:#4D8BFF;--border:#F5F3EC;--shadow-color:#F5F3EC;--grid-line:rgba(255,255,255,.06)}
*{scroll-behavior:smooth;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background-color:var(--bg);color:var(--ink);margin:0;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;background-image:linear-gradient(to right,var(--grid-line) 1px,transparent 1px),linear-gradient(to bottom,var(--grid-line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
.font-display{font-family:'Archivo Black',sans-serif;letter-spacing:-.02em}
.font-mono-tag{font-family:'Space Mono',monospace}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.6px;padding:12px 22px;border:2px solid var(--border);border-radius:0;cursor:pointer;text-decoration:none;transition:all .09s;white-space:nowrap}
.btn-primary{background:var(--lime);color:#0A0A0A;box-shadow:4px 4px 0 var(--shadow-color)}
.btn-primary:hover:not(:disabled){transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--shadow-color);background:var(--amber)}
.btn-secondary{background:var(--surface);color:var(--ink);box-shadow:4px 4px 0 var(--shadow-color)}
.btn-secondary:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--blue);border-color:var(--blue);color:var(--blue)}
.form-input{width:100%;background:var(--bg);border:2px solid var(--border);padding:11px 14px 11px 40px;color:var(--ink);font-weight:600;font-size:14px;outline:none;transition:all .1s}
.form-input:focus{border-color:var(--blue);box-shadow:4px 4px 0 var(--blue)}
.error-message{display:none;background:#FFE5E5;border:2px solid #D40000;color:#8A0000;padding:10px 14px;font-size:12px;font-weight:800;box-shadow:3px 3px 0 #D40000;margin-bottom:16px}
.error-message.show{display:block}
.spinner{animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body data-theme="light">
<script>(function() { const saved = localStorage.getItem('pk-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); })();</script>

<nav class="fixed top-0 left-0 right-0 z-[1000] h-[76px] bg-[var(--bg)] border-b-[2px] border-[var(--border)]">
<div class="max-w-7xl mx-auto px-4 sm:px-6 h-full flex items-center justify-between gap-3">
    <a class="text-xl sm:text-2xl font-black tracking-tight flex items-center gap-2 shrink-0" href="/">
        <span class="bg-[var(--lime)] text-[#0A0A0A] px-2.5 py-1 border-2 border-[var(--border)] font-black shadow-[2px_2px_0px_var(--shadow-color)]">Seller</span>
        <span class="text-[var(--ink)] font-black">Kuu</span>
    </a>
    <div class="flex items-center gap-2.5">
        <button class="btn btn-secondary !py-2 !px-3.5" id="themeToggle"><span class="material-symbols-outlined text-lg">dark_mode</span></button>
        <a href="/" class="btn btn-secondary !py-2 !px-3.5 hidden sm:inline-flex">Beranda</a>
    </div>
</div>
</nav>

<main class="flex-1 flex items-center justify-center p-4 pt-28 pb-10">
    <div class="bg-[var(--surface)] border-[3px] border-[var(--border)] shadow-[8px_8px_0px_var(--amber)] max-w-md w-full p-6 sm:p-10 relative">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-[var(--blue)] text-white border-2 border-[var(--border)] shadow-[3px_3px_0px_var(--shadow-color)] mb-4">
                <span class="material-symbols-outlined text-3xl">storefront</span>
            </div>
            <h1 class="font-display text-3xl sm:text-4xl text-[var(--ink)]">Login Seller</h1>
            <p class="text-[var(--ink-muted)] font-bold mt-2 text-sm">Masuk ke dashboard penjual</p>
        </div>

        <div class="error-message" id="loginError">
            <i class="fas fa-exclamation-circle mr-2"></i><span id="errorMessage">Email atau password salah</span>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-black uppercase tracking-wide mb-1.5 text-[var(--ink)] font-mono-tag" for="email">Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[var(--ink-muted)]">mail</span>
                    <input class="form-input" id="email" type="email" placeholder="seller@email.com" required autocomplete="email"/>
                </div>
            </div>
            <div>
                <label class="block text-xs font-black uppercase tracking-wide mb-1.5 text-[var(--ink)] font-mono-tag" for="password">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[var(--ink-muted)]">lock</span>
                    <input class="form-input" id="password" type="password" placeholder="••••••••" required autocomplete="current-password"/>
                </div>
            </div>
            <button class="btn btn-primary w-full !py-3.5 mt-4" id="loginBtn" type="submit"><span class="material-symbols-outlined text-lg">login</span> Masuk</button>
        </form>

        <div class="mt-8 pt-6 border-t-2 border-dashed border-[var(--ink-muted)] text-center">
            <p class="text-sm font-bold text-[var(--ink-muted)]">Belum punya akun? <br/><a href="/seller/register" class="text-[var(--blue)] hover:underline hover:text-[var(--amber)] transition-colors">Daftar di sini</a></p>
        </div>
    </div>
</main>

<script>
document.getElementById('themeToggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); document.body.setAttribute('data-theme', next); localStorage.setItem('pk-theme', next);
    document.getElementById('themeToggle').innerHTML = `<span class="material-symbols-outlined text-lg">${next === 'dark' ? 'light_mode' : 'dark_mode'}</span>`;
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');
    const errorMsg = document.getElementById('errorMessage');

    btn.disabled = true; btn.innerHTML = '<span class="material-symbols-outlined spinner text-lg">refresh</span> Memproses...';
    errorEl.classList.remove('show');

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');

        localStorage.setItem('pk_token', data.token);
        localStorage.setItem('pk_user', JSON.stringify(data.user));

        if (data.user.role === 'seller') window.location.href = '/seller/dashboard';
        else if (data.user.role === 'admin') window.location.href = '/admin/dashboard';
        else throw new Error('Role tidak valid');
    } catch (error) {
        errorMsg.textContent = error.message;
        errorEl.classList.add('show');
        btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined text-lg">login</span> Masuk';
    }
});
</script>
</body>
</html>
