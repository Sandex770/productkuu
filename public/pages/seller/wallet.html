<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wallet - ProductKuu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&family=Archivo+Black&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
:root,[data-theme="light"]{--bg:#F4F1E8;--bg-grid:rgba(0,0,0,.055);--surface:#FFF;--surface-2:#FAF8F0;--ink:#0A0A0A;--ink-muted:#4A4A4A;--lime:#C4F000;--amber:#FFC400;--blue:#2B6FFF;--border:#0A0A0A;--shadow-color:#0A0A0A;--grid-line:rgba(0,0,0,.08);--nav-bg:#F4F1E8}
[data-theme="dark"]{--bg:#0B0B0D;--bg-grid:rgba(255,255,255,.045);--surface:#16161A;--surface-2:#1E1E24;--ink:#F5F3EC;--ink-muted:#B8B8C0;--lime:#C4F000;--amber:#FFC400;--blue:#4D8BFF;--border:#F5F3EC;--shadow-color:#F5F3EC;--grid-line:rgba(255,255,255,.06);--nav-bg:#0B0B0D}
*{scroll-behavior:smooth;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background-color:var(--bg);color:var(--ink);margin:0;line-height:1.6;overflow-x:hidden;background-image:linear-gradient(to right,var(--grid-line) 1px,transparent 1px),linear-gradient(to bottom,var(--grid-line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
.font-mono-tag{font-family:'Space Mono',monospace}
.font-display{font-family:'Archivo Black',sans-serif;letter-spacing:-.02em}
.neo-tag{display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:#0A0A0A;font-weight:900;font-size:11px;text-transform:uppercase;padding:6px 14px;border:2px solid var(--border);box-shadow:3px 3px 0 var(--shadow-color);font-family:'Space Mono',monospace}
.neo-tag.blue{background:var(--blue);color:#FFF}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-weight:900;font-size:13px;text-transform:uppercase;padding:10px 20px;border:2px solid var(--border);cursor:pointer;transition:all .09s;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--lime);color:#0A0A0A;box-shadow:4px 4px 0 var(--shadow-color)}
.btn-primary:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--shadow-color);background:var(--amber)}
.btn-secondary{background:var(--surface);color:var(--ink);box-shadow:4px 4px 0 var(--shadow-color)}
.btn-secondary:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--blue);border-color:var(--blue);color:var(--blue)}
.btn-danger{background:#FF4444;color:#FFF;box-shadow:4px 4px 0 var(--shadow-color)}
.btn-danger:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 #0A0A0A}
.stat-card{background:var(--surface);border:2px solid var(--border);box-shadow:4px 4px 0 var(--shadow-color);padding:22px 16px;position:relative;display:flex;flex-direction:column;justify-content:center}
.stat-card::before{content:"";position:absolute;top:-2px;left:-2px;width:18px;height:18px;background:var(--amber);border-right:2px solid var(--border);border-bottom:2px solid var(--border)}
.badge{padding:4px 10px;border:1.5px solid var(--border);font-size:10px;font-weight:900;text-transform:uppercase;font-family:'Space Mono',monospace;box-shadow:2px 2px 0 var(--shadow-color);display:inline-block}
.badge-success{background:var(--lime);color:#0A0A0A}.badge-warning{background:var(--amber);color:#0A0A0A}.badge-danger{background:#FF4444;color:#FFF}
</style>
</head>
<body data-theme="light">
<script>
    const token = localStorage.getItem('pk_token'); const userStr = localStorage.getItem('pk_user');
    if (!token || !userStr) { window.location.replace('/seller/login'); } 
    else { try { const u = JSON.parse(userStr); if (u.role !== 'seller') window.location.replace('/'); } catch(e) { window.location.replace('/seller/login'); } }
</script>

<nav class="fixed top-0 left-0 right-0 z-[1000] h-[76px] bg-[var(--nav-bg)] border-b-[2px] border-[var(--border)]">
<div class="max-w-7xl mx-auto px-4 sm:px-6 h-full flex items-center justify-between gap-3">
    <a class="text-xl sm:text-2xl font-black tracking-tight flex items-center gap-2 shrink-0" href="/seller/dashboard"><span class="bg-[var(--lime)] text-[#0A0A0A] px-2.5 py-1 border-2 border-[var(--border)] font-black shadow-[2px_2px_0px_var(--shadow-color)]">Seller</span><span class="text-[var(--ink)] font-black">Panel</span></a>
    <div class="flex items-center gap-2.5">
        <button class="btn btn-secondary !py-2 !px-3.5" id="themeToggle"><span class="material-symbols-outlined text-lg">dark_mode</span></button>
        <button class="lg:hidden btn btn-secondary !py-2 !px-3.5" id="sidebarToggle"><span class="material-symbols-outlined text-lg">menu</span></button>
        <button class="btn btn-danger !py-2 !px-3.5" id="logoutBtn">Logout</button>
    </div>
</div>
</nav>
<div class="fixed inset-0 bg-black/50 z-[800] hidden transition-opacity" id="sidebarOverlay"></div>
<aside class="fixed top-[76px] left-0 bottom-0 w-[260px] bg-[var(--surface)] border-r-[2px] border-[var(--border)] z-[900] flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-300" id="sidebar">
    <div class="p-4 border-b-2 border-[var(--border)] bg-[var(--bg)]"><p class="text-[10px] font-black text-[var(--ink-muted)] uppercase tracking-widest font-mono-tag">Menu Seller</p></div>
    <nav class="p-4 flex flex-col gap-2 flex-1 overflow-y-auto">
        <a href="/seller/dashboard" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">dashboard</span> Dashboard</a>
        <a href="/seller/products" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">inventory_2</span> Produk</a>
        <a href="/seller/wallet" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-[var(--border)] bg-[var(--lime)] text-[#0A0A0A] shadow-[3px_3px_0px_var(--shadow-color)]"><span class="material-symbols-outlined">account_balance_wallet</span> Wallet</a>
        <a href="/seller/transactions" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">receipt_long</span> Transaksi</a>
        <a href="/seller/withdraw" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">arrow_upward</span> Withdraw</a>
        <a href="/seller/settings" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">settings</span> Pengaturan</a>
    </nav>
</aside>

<main class="pt-[100px] pb-10 px-4 lg:ml-[260px] transition-all">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between md:items-end gap-6 mb-10">
            <div>
                <span class="neo-tag blue mb-3">SALDO ANDA</span>
                <h1 class="font-display text-3xl sm:text-5xl text-[var(--ink)] mt-3">Wallet</h1>
            </div>
            <div class="w-full md:w-auto flex gap-2">
                <button class="btn btn-secondary flex-1 md:flex-none" onclick="loadWallet()"><span class="material-symbols-outlined">sync</span> Refresh</button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            <div class="stat-card">
                <div class="text-xs font-black text-[var(--ink-muted)] uppercase mb-1">Saldo Tersedia</div>
                <div class="font-display text-3xl text-[var(--lime-deep)]" id="available">Rp0</div>
            </div>
            <div class="stat-card">
                <div class="text-xs font-black text-[var(--ink-muted)] uppercase mb-1">Saldo Ditahan</div>
                <div class="font-display text-3xl text-[var(--amber-deep)]" id="holding">Rp0</div>
            </div>
            <div class="stat-card">
                <div class="text-xs font-black text-[var(--ink-muted)] uppercase mb-1">Total Pendapatan</div>
                <div class="font-display text-3xl text-[var(--blue)]" id="revenue">Rp0</div>
            </div>
            <div class="stat-card">
                <div class="text-xs font-black text-[var(--ink-muted)] uppercase mb-1">Total Withdraw</div>
                <div class="font-display text-3xl text-[var(--ink)]" id="withdraw">Rp0</div>
            </div>
        </div>

        <div class="bg-[var(--surface)] border-2 border-[var(--border)] shadow-[4px_4px_0px_var(--shadow-color)] p-6">
            <h3 class="font-display text-xl mb-4">Riwayat Transaksi Masuk</h3>
            <div id="history" class="space-y-4">
                <div class="text-center py-6 font-bold text-[var(--ink-muted)]">Memuat data...</div>
            </div>
        </div>
    </div>
</main>

<script>
(function() { const saved = localStorage.getItem('pk-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); })();
document.getElementById('themeToggle').addEventListener('click', () => {
    const c = document.documentElement.getAttribute('data-theme') || 'light'; const n = c === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n); document.body.setAttribute('data-theme', n); localStorage.setItem('pk-theme', n);
    document.getElementById('themeToggle').innerHTML = `<span class="material-symbols-outlined text-lg">${n === 'dark' ? 'light_mode' : 'dark_mode'}</span>`;
});
const sidebar = document.getElementById('sidebar'); const sidebarOverlay = document.getElementById('sidebarOverlay');
document.getElementById('sidebarToggle').addEventListener('click', () => { sidebar.classList.toggle('-translate-x-full'); sidebarOverlay.classList.toggle('hidden'); });
sidebarOverlay.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); });
document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.clear(); window.location.href = '/seller/login'; });

const user = JSON.parse(localStorage.getItem('pk_user') || '{}');

async function loadWallet() {
    try {
        const res = await fetch('/api/users/' + user.id);
        const u = await res.json();
        if(u.wallet) {
            const w = typeof u.wallet === 'string' ? JSON.parse(u.wallet) : u.wallet;
            document.getElementById('available').textContent = `Rp${new Intl.NumberFormat('id-ID').format(w.available || 0)}`;
            document.getElementById('holding').textContent = `Rp${new Intl.NumberFormat('id-ID').format(w.holding || 0)}`;
            document.getElementById('revenue').textContent = `Rp${new Intl.NumberFormat('id-ID').format(w.totalRevenue || 0)}`;
            document.getElementById('withdraw').textContent = `Rp${new Intl.NumberFormat('id-ID').format(w.totalWithdraw || 0)}`;
        }
    } catch(e) { console.error(e); }

    const container = document.getElementById('history');
    try {
        const res = await fetch('/api/orders');
        const orders = await res.json();
        const list = orders.filter(o => o.sellerId === user.id && o.paymentStatus === 'settlement');
        
        if(list.length === 0) { container.innerHTML = '<div class="text-center py-6 font-bold text-[var(--ink-muted)]">Belum ada transaksi</div>'; return; }
        
        container.innerHTML = list.map(o => `
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 border-2 border-[var(--border)] bg-[var(--bg)] gap-4">
                <div>
                    <div class="font-black text-[var(--ink)]">${o.productName}</div>
                    <div class="text-xs font-mono-tag text-[var(--ink-muted)] mt-1">${new Date(o.createdAt).toLocaleDateString('id-ID')}</div>
                </div>
                <div class="font-black text-[var(--blue)] text-lg">+Rp${new Intl.NumberFormat('id-ID').format(o.amount)}</div>
            </div>
        `).join('');
    } catch(e) { console.error(e); }
}
document.addEventListener('DOMContentLoaded', loadWallet);
</script>
</body>
</html>
