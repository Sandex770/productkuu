<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - ProductKuu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" href="../../assets/images/favicon.ico">
    <style>
        .wallet-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .transaction-item:last-child { border-bottom: none; }
        @media (max-width: 768px) { .wallet-stats { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .wallet-stats { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-logo"><i class="fas fa-cube"></i><span>ProductKuu</span></a>
            <div class="navbar-actions">
                <button class="btn-icon" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="btn-icon" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <aside class="sidebar" id="sidebar">
        <div style="padding: 0 12px 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px;">
            <div style="font-weight: 600; font-size: 14px; color: var(--text-secondary);">Menu Seller</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/seller/dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="/seller/products"><i class="fas fa-box"></i> Produk</a>
            <a href="/seller/wallet" class="active"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="/seller/transactions"><i class="fas fa-exchange-alt"></i> Transaksi</a>
            <a href="/seller/withdraw"><i class="fas fa-arrow-up"></i> Withdraw</a>
            <a href="/seller/settings"><i class="fas fa-cog"></i> Pengaturan</a>
            <button onclick="handleLogout()" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: none; background: none; width: 100%; border-radius: var(--radius); color: var(--danger); cursor: pointer; font-family: var(--font); font-size: 14px; font-weight: 500; margin-top: 8px;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <div><h1 style="font-size: 24px;">Wallet</h1><p style="color: var(--text-secondary);">Kelola saldo dan pendapatan Anda</p></div>
        </div>

        <div class="wallet-stats" id="walletStats">
            <div class="stat-card">
                <div class="stat-info"><span class="stat-label">Saldo Tersedia</span><span class="stat-value" style="color: var(--success);" id="availableBalance">Rp0</span></div>
                <div class="stat-icon green"><i class="fas fa-wallet"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info"><span class="stat-label">Saldo Ditahan</span><span class="stat-value" style="color: var(--warning);" id="holdingBalance">Rp0</span></div>
                <div class="stat-icon yellow"><i class="fas fa-clock"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info"><span class="stat-label">Total Pendapatan</span><span class="stat-value" style="color: var(--primary);" id="totalRevenue">Rp0</span></div>
                <div class="stat-icon indigo"><i class="fas fa-money-bill-wave"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info"><span class="stat-label">Total Withdraw</span><span class="stat-value" style="color: var(--secondary);" id="totalWithdraw">Rp0</span></div>
                <div class="stat-icon purple"><i class="fas fa-arrow-up"></i></div>
            </div>
        </div>

        <div class="card">
            <h4 style="margin-bottom: 16px;">Riwayat Transaksi</h4>
            <div id="transactionHistory">
                <div class="text-center" style="color: var(--text-secondary); padding: 20px 0;">Memuat transaksi...</div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { db, auth, collections, collection, doc, getDoc, getDocs, query, where, orderBy, limit, onSnapshot, signOut } from '../../js/firebase-config.js';
        import { showToast, formatPrice, formatDate, navigate } from '../../js/app.js';

        let currentUser = null;

        // Theme
        const themeToggle = document.getElementById('themeToggle');
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            localStorage.setItem('darkMode', darkMode);
            themeToggle.querySelector('i').className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
        });

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        };

        document.addEventListener('DOMContentLoaded', async () => {
            auth.onAuthStateChanged(async (user) => {
                if (!user) { navigate('/seller/login'); return; }
                currentUser = user;
                await loadWalletData(user.uid);
                await loadTransactions(user.uid);
                setupRealtimeListeners(user.uid);
            });
        });

        async function loadWalletData(uid) {
            try {
                const userRef = doc(db, collections.users, uid);
                const userDoc = await getDoc(userRef);
                if (userDoc.exists) {
                    const data = userDoc.data();
                    const wallet = data.wallet || { available: 0, holding: 0, totalRevenue: 0, totalWithdraw: 0 };
                    document.getElementById('availableBalance').textContent = `Rp${formatPrice(wallet.available || 0)}`;
                    document.getElementById('holdingBalance').textContent = `Rp${formatPrice(wallet.holding || 0)}`;
                    document.getElementById('totalRevenue').textContent = `Rp${formatPrice(wallet.totalRevenue || 0)}`;
                    document.getElementById('totalWithdraw').textContent = `Rp${formatPrice(wallet.totalWithdraw || 0)}`;
                }
            } catch (error) { console.error('Error loading wallet:', error); }
        }

        async function loadTransactions(uid) {
            try {
                const q = query(collection(db, collections.orders), where('sellerId', '==', uid), orderBy('createdAt', 'desc'), limit(20));
                const snapshot = await getDocs(q);
                const container = document.getElementById('transactionHistory');
                if (snapshot.empty) {
                    container.innerHTML = `<div class="text-center" style="color: var(--text-secondary); padding: 20px 0;"><i class="fas fa-receipt" style="font-size: 24px; display: block; margin-bottom: 8px;"></i>Belum ada transaksi</div>`;
                    return;
                }
                container.innerHTML = snapshot.docs.map(doc => {
                    const t = doc.data();
                    const statusColors = { 'pending': 'badge-warning', 'settlement': 'badge-success', 'failed': 'badge-danger', 'expire': 'badge-danger' };
                    return `<div class="transaction-item">
                        <div><strong>${t.productName || 'Product'}</strong><br><span style="font-size: 13px; color: var(--text-secondary);">${t.buyerName} • ${formatDate(t.createdAt)}</span></div>
                        <div style="text-align: right;">
                            <span style="font-weight: 600; color: ${t.paymentStatus === 'settlement' ? 'var(--success)' : 'var(--text-secondary)'};">${t.paymentStatus === 'settlement' ? '+' : ''}Rp${formatPrice(t.amount)}</span>
                            <br><span class="badge ${statusColors[t.paymentStatus] || 'badge-info'}">${t.paymentStatus || t.status}</span>
                            <br><span style="font-size: 11px; color: var(--text-light);">${t.orderId}</span>
                        </div>
                    </div>`;
                }).join('');
            } catch (error) { console.error('Error loading transactions:', error); document.getElementById('transactionHistory').innerHTML = '<div class="text-center" style="color: var(--danger);">Gagal memuat transaksi</div>'; }
        }

        function setupRealtimeListeners(uid) {
            onSnapshot(query(collection(db, collections.orders), where('sellerId', '==', uid)), () => { loadWalletData(uid); loadTransactions(uid); });
        }

        window.handleLogout = async function() { try { await signOut(auth); showToast('success', 'Berhasil logout'); navigate('/'); } catch (error) { showToast('error', 'Gagal logout'); } };
        document.querySelectorAll('.sidebar-nav a').forEach(link => { link.addEventListener('click', function(e) { e.preventDefault(); navigate(this.getAttribute('href')); }); });
    </script>
</body>
</html>
