<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Withdraw - ProductKuu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&family=Archivo+Black&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
:root,[data-theme="light"]{--bg:#F4F1E8;--bg-grid:rgba(0,0,0,.055);--surface:#FFF;--surface-2:#FAF8F0;--ink:#0A0A0A;--ink-muted:#4A4A4A;--ink-soft:#7A7A7A;--lime:#C4F000;--lime-deep:#9BC400;--amber:#FFC400;--amber-deep:#D9A300;--blue:#2B6FFF;--blue-deep:#1E4FCC;--blue-soft:#E6EEFF;--border:#0A0A0A;--border-width:2px;--shadow-color:#0A0A0A;--shadow-x:4px;--shadow-y:4px;--grid-line:rgba(0,0,0,.08);--nav-bg:#F4F1E8}
[data-theme="dark"]{--bg:#0B0B0D;--bg-grid:rgba(255,255,255,.045);--surface:#16161A;--surface-2:#1E1E24;--ink:#F5F3EC;--ink-muted:#B8B8C0;--ink-soft:#8A8A92;--lime:#C4F000;--lime-deep:#A8D400;--amber:#FFC400;--amber-deep:#E0AC00;--blue:#4D8BFF;--blue-deep:#2B6FFF;--blue-soft:#1A2540;--border:#F5F3EC;--border-width:2px;--shadow-color:#F5F3EC;--shadow-x:4px;--shadow-y:4px;--grid-line:rgba(255,255,255,.06);--nav-bg:#0B0B0D}
*{scroll-behavior:smooth;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background-color:var(--bg);color:var(--ink);margin:0;line-height:1.6;overflow-x:hidden;transition:background-color .35s ease,color .35s ease;background-image:linear-gradient(to right,var(--grid-line) 1px,transparent 1px),linear-gradient(to bottom,var(--grid-line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
.font-mono-tag{font-family:'Space Mono',monospace}
.font-display{font-family:'Archivo Black',sans-serif;letter-spacing:-.02em}
.neo-tag{display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:#0A0A0A;font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.9px;padding:6px 14px;border:var(--border-width) solid var(--border);box-shadow:3px 3px 0 var(--shadow-color);font-family:'Space Mono',monospace}
.neo-tag.blue{background:var(--blue);color:#FFF}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.6px;padding:10px 20px;border:var(--border-width) solid var(--border);border-radius:0;cursor:pointer;text-decoration:none;transition:all .09s;white-space:nowrap}
.btn-primary{background:var(--lime);color:#0A0A0A;box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--shadow-color)}
.btn-primary:hover:not(:disabled){transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--shadow-color);background:var(--amber)}
.btn-secondary{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--shadow-color)}
.btn-secondary:hover:not(:disabled){transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--blue);border-color:var(--blue);color:var(--blue)}
.form-input{width:100%;background:var(--bg);border:var(--border-width) solid var(--border);padding:11px 14px;color:var(--ink);font-weight:600;font-size:14px;outline:none}
.form-input:focus{border-color:var(--blue);box-shadow:4px 4px 0 var(--blue)}
.card{background:var(--surface);border:var(--border-width) solid var(--border);box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--shadow-color);padding:24px}
</style>
</head>
<body data-theme="light">

<script>
    const token = localStorage.getItem('pk_token');
    const userStr = localStorage.getItem('pk_user');
    if (!token || !userStr) { window.location.replace('/seller/login'); } 
    else { try { const u = JSON.parse(userStr); if (u.role !== 'seller') window.location.replace('/'); } catch(e) { window.location.replace('/seller/login'); } }
</script>

<nav class="fixed top-0 left-0 right-0 z-[1000] h-[76px] bg-[var(--nav-bg)] border-b-[2px] border-[var(--border)]">
<div class="max-w-7xl mx-auto px-4 sm:px-6 h-full flex items-center justify-between gap-3">
    <a class="text-xl sm:text-2xl font-black tracking-tight flex items-center gap-2 shrink-0" href="/seller/dashboard">
        <span class="bg-[var(--lime)] text-[#0A0A0A] px-2.5 py-1 border-2 border-[var(--border)] font-black shadow-[2px_2px_0px_var(--shadow-color)]">Seller</span>
        <span class="text-[var(--ink)] font-black">Panel</span>
    </a>
    <div class="flex items-center gap-2.5">
        <button class="btn btn-secondary !py-2 !px-3.5" id="themeToggle"><span class="material-symbols-outlined text-lg">dark_mode</span></button>
        <button class="lg:hidden btn btn-secondary !py-2 !px-3.5" id="sidebarToggle"><span class="material-symbols-outlined text-lg">menu</span></button>
        <button class="btn btn-danger !py-2 !px-3.5" id="logoutBtn">Logout</button>
    </div>
</div>
</nav>
<div class="fixed inset-0 bg-black/50 z-[800] hidden transition-opacity" id="sidebarOverlay"></div>
<aside class="fixed top-[76px] left-0 bottom-0 w-[260px] bg-[var(--surface)] border-r-[2px] border-[var(--border)] z-[900] flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-300" id="sidebar">
    <div class="p-4 border-b-2 border-[var(--border)] bg-[var(--bg)]"><p class="text-[10px] font-black text-[var(--ink-muted)] uppercase tracking-widest font-mono-tag">Menu Seller</p></div>
    <nav class="p-4 flex flex-col gap-2 flex-1 overflow-y-auto">
        <a href="/seller/dashboard" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">dashboard</span> Dashboard</a>
        <a href="/seller/products" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">inventory_2</span> Produk</a>
        <a href="/seller/wallet" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">account_balance_wallet</span> Wallet</a>
        <a href="/seller/transactions" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">receipt_long</span> Transaksi</a>
        <a href="/seller/withdraw" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-[var(--border)] bg-[var(--lime)] text-[#0A0A0A] shadow-[3px_3px_0px_var(--shadow-color)]"><span class="material-symbols-outlined">arrow_upward</span> Withdraw</a>
        <a href="/seller/settings" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">settings</span> Pengaturan</a>
    </nav>
</aside>

<main class="pt-[100px] pb-10 px-4 lg:ml-[260px] transition-all">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between md:items-end gap-6 mb-10">
            <div>
                <span class="neo-tag blue mb-3">PENARIKAN DANA</span>
                <h1 class="font-display text-3xl sm:text-5xl text-[var(--ink)] mt-3">Withdraw</h1>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="card">
                <h3 class="font-display text-xl mb-4">Form Withdraw</h3>
                <div class="bg-[var(--bg)] border-2 border-[var(--border)] p-4 mb-6">
                    <div class="text-xs font-black text-[var(--ink-muted)] uppercase">Saldo Tersedia</div>
                    <div class="text-3xl font-black text-[var(--blue)] mt-1" id="availableBalance">Rp0</div>
                </div>
                <form id="withdrawForm" class="space-y-4">
                    <div><label class="block text-xs font-black uppercase mb-1">Nominal Withdraw *</label><input class="form-input" id="amount" type="number" required placeholder="Minimal Rp50.000"/></div>
                    <div><label class="block text-xs font-black uppercase mb-1">Metode *</label>
                        <select class="form-input" id="method" required>
                            <option value="">Pilih Metode</option>
                            <option value="DANA">DANA</option>
                            <option value="OVO">OVO</option>
                            <option value="GoPay">GoPay</option>
                            <option value="BCA">Bank BCA</option>
                        </select>
                    </div>
                    <div><label class="block text-xs font-black uppercase mb-1">Nomor Tujuan *</label><input class="form-input" id="accountNumber" required/></div>
                    <div><label class="block text-xs font-black uppercase mb-1">Nama Pemilik *</label><input class="form-input" id="accountName" required/></div>
                    <button class="btn btn-primary w-full mt-4" type="submit" id="submitBtn">Ajukan Withdraw</button>
                </form>
            </div>

            <div class="card">
                <h3 class="font-display text-xl mb-4">Riwayat Withdraw</h3>
                <div id="withdrawHistory" class="space-y-4">
                    <div class="text-center py-6 font-bold text-[var(--ink-muted)]">Memuat data...</div>
                </div>
            </div>
        </div>
    </div>
</main>

<div id="toastContainer" class="fixed bottom-6 right-6 z-[3000] flex flex-col gap-2"></div>

<script>
// ============================================
// THEME & UI
// ============================================
(function() { const saved = localStorage.getItem('pk-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); })();
document.getElementById('themeToggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); document.body.setAttribute('data-theme', next); localStorage.setItem('pk-theme', next);
    document.getElementById('themeToggle').innerHTML = `<span class="material-symbols-outlined text-lg">${next === 'dark' ? 'light_mode' : 'dark_mode'}</span>`;
});
const sidebar = document.getElementById('sidebar'); const sidebarOverlay = document.getElementById('sidebarOverlay');
document.getElementById('sidebarToggle').addEventListener('click', () => { sidebar.classList.toggle('-translate-x-full'); sidebarOverlay.classList.toggle('hidden'); });
sidebarOverlay.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); });
document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.clear(); window.location.href = '/seller/login'; });

// ============================================
// STATE & HELPER
// ============================================
const user = JSON.parse(localStorage.getItem('pk_user') || '{}');
let availableBalance = 0;

function showToast(type, msg) {
    const container = document.getElementById('toastContainer');
    const colors = { success: 'bg-[var(--lime)] text-black', error: 'bg-red-500 text-white', info: 'bg-blue-500 text-white' };
    const toast = document.createElement('div');
    toast.className = `${colors[type] || 'bg-black text-white'} px-4 py-3 font-bold text-sm border-2 border-black shadow-[4px_4px_0px_#000]`;
    toast.innerHTML = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
}

async function fetchAPI(url, options = {}) {
    const res = await fetch(url, options);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'API Error');
    return data;
}

// ============================================
// LOAD DATA (SALDO & RIWAYAT)
// ============================================
async function loadData() {
    // 1. Ambil saldo terbaru
    try {
        const u = await fetchAPI('/api/users/' + user.id);
        if(u.wallet) {
            const w = typeof u.wallet === 'string' ? JSON.parse(u.wallet) : u.wallet;
            availableBalance = w.available || 0;
            document.getElementById('availableBalance').textContent = `Rp${new Intl.NumberFormat('id-ID').format(availableBalance)}`;
        }
    } catch(e) { console.error(e); }

    // 2. Ambil riwayat penarikan
    const container = document.getElementById('withdrawHistory');
    try {
        const data = await fetchAPI('/api/withdrawals');
        const list = data.filter(w => w.sellerId === user.id);
        
        if(list.length === 0) {
            container.innerHTML = '<div class="text-center py-6 font-bold text-[var(--ink-muted)]">Belum ada riwayat.</div>';
            return;
        }

        container.innerHTML = list.map(w => `
            <div class="flex justify-between items-center p-4 border-2 border-[var(--border)] bg-[var(--bg)]">
                <div>
                    <div class="font-black text-[var(--blue)]">Rp${new Intl.NumberFormat('id-ID').format(w.amount)}</div>
                    <div class="text-xs font-mono-tag text-[var(--ink-muted)] mt-1">${w.method} • ${w.accountNumber}</div>
                </div>
                <span class="badge ${w.status === 'approved' ? 'badge-success' : (w.status === 'pending' ? 'badge-warning' : 'badge-danger')}">${w.status}</span>
            </div>
        `).join('');
    } catch(e) { console.error(e); }
}

// ============================================
// SUBMIT FORM WITHDRAW
// ============================================
document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const amount = parseInt(document.getElementById('amount').value);
    
    if(amount < 50000) return showToast('warning', 'Minimal penarikan Rp50.000');
    if(amount > availableBalance) return showToast('error', 'Saldo tidak mencukupi');

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; 
    btn.innerHTML = '<span class="material-symbols-outlined spinner text-lg">refresh</span> Memproses...';

    try {
        // 1. Simpan pengajuan withdraw
        await fetchAPI('/api/withdrawals', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                id: Date.now().toString(),
                sellerId: user.id,
                amount: amount,
                method: document.getElementById('method').value,
                accountNumber: document.getElementById('accountNumber').value,
                accountName: document.getElementById('accountName').value,
                status: 'pending',
                createdAt: new Date().toISOString()
            })
        });

        // 2. Potong saldo seller (pindah ke pending)
        const uData = await fetchAPI('/api/users/' + user.id);
        const w = typeof uData.wallet === 'string' ? JSON.parse(uData.wallet) : uData.wallet;
        
        await fetchAPI('/api/users/' + user.id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                ...uData,
                wallet: {
                    ...w,
                    available: w.available - amount,
                    pendingWithdraw: (w.pendingWithdraw || 0) + amount
                }
            })
        });

        showToast('success', 'Pengajuan berhasil dikirim!');
        document.getElementById('withdrawForm').reset();
        loadData();
    } catch(e) {
        showToast('error', 'Gagal memproses: ' + e.message);
    } finally {
        btn.disabled = false; 
        btn.innerHTML = 'Ajukan Withdraw';
    }
});

document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
