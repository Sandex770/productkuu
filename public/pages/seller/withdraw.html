<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - ProductKuu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/assets/images/favicon.ico">
    <style>
        .app-wrapper { display: flex; min-height: calc(100vh - 64px); margin-top: 64px; }
        .sidebar { width: 260px; background: var(--bg-primary); border-right: 1px solid var(--border-color); padding: 20px 0; position: fixed; top: 64px; bottom: 0; overflow-y: auto; z-index: 100; transition: transform 0.3s ease; }
        .sidebar-header { padding: 0 16px 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
        .sidebar-header .title { font-weight: 600; font-size: 14px; color: var(--text-secondary); }
        .sidebar-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }
        .sidebar-nav a, .sidebar-nav button { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius); color: var(--text-secondary); transition: var(--transition); font-size: 14px; font-weight: 500; text-decoration: none; background: none; border: none; width: 100%; cursor: pointer; font-family: var(--font); text-align: left; }
        .sidebar-nav a:hover, .sidebar-nav button:hover { background: var(--bg-secondary); color: var(--text-primary); }
        .sidebar-nav a.active { background: rgba(79,70,229,0.1); color: var(--primary); }
        .sidebar-nav .logout-btn { color: var(--danger); margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 16px; }
        .sidebar-nav .logout-btn:hover { background: rgba(239,68,68,0.1); color: var(--danger); }
        .sidebar-overlay { display: none; position: fixed; top: 64px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; }
        .sidebar-overlay.open { display: block; }
        .main-content { margin-left: 260px; padding: 24px; flex: 1; min-height: calc(100vh - 64px); }
        .mobile-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--text-primary); cursor: pointer; padding: 8px; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); width: 280px; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 16px; } .mobile-toggle { display: block !important; } }
        
        .withdraw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background: var(--bg-primary); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .input-group label { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        .input { width: 100%; padding: 12px 16px; border: 2px solid var(--border-color); border-radius: var(--radius); font-family: var(--font); font-size: 14px; transition: all 0.3s; background: var(--bg-primary); color: var(--text-primary); }
        .input:focus { outline: none; border-color: #4F46E5; box-shadow: 0 0 0 4px rgba(79,70,229,0.1); }
        textarea.input { resize: vertical; min-height: 60px; }
        
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
        .badge-success { background: rgba(16,185,129,0.1); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,0.1); color: var(--warning); }
        .badge-danger { background: rgba(239,68,68,0.1); color: var(--danger); }
        .badge-info { background: rgba(59,130,246,0.1); color: var(--info); }
        
        .withdraw-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .withdraw-item:last-child { border-bottom: none; }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .text-center { text-align: center; }
        .text-secondary { color: var(--text-secondary); }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: none; border-radius: 12px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, #4F46E5, #7C3AED); color: white; box-shadow: 0 4px 14px rgba(79,70,229,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,70,229,0.4); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-color); transform: translateY(-2px); }
        .btn-block { width: 100%; justify-content: center; }
        .btn-sm { padding: 8px 16px; font-size: 12px; }
        
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 12px; max-width: 400px; width: 100%; }
        .toast { padding: 16px 20px; border-radius: var(--radius); background: var(--bg-primary); box-shadow: var(--shadow-lg); border-left: 4px solid var(--primary); animation: slideInRight 0.3s ease; display: flex; align-items: center; gap: 12px; }
        .toast-icon { font-size: 20px; }
        .toast-content { flex: 1; }
        .toast-message { font-size: 13px; color: var(--text-secondary); }
        .toast-close { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 16px; padding: 4px; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        
        .balance-box { padding: 12px 16px; background: rgba(79,70,229,0.1); border-radius: var(--radius); margin-bottom: 16px; }
        .balance-box .label { font-size: 13px; color: var(--text-secondary); }
        .balance-box .value { font-size: 24px; font-weight: 700; color: var(--primary); }
        
        @media (max-width: 768px) { .withdraw-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-logo"><i class="fas fa-cube"></i><span>ProductKuu</span></a>
            <div class="navbar-actions">
                <button class="btn-icon" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="mobile-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="title">Menu Seller</div></div>
        <nav class="sidebar-nav">
            <a href="/seller/dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="/seller/products"><i class="fas fa-box"></i> Produk</a>
            <a href="/seller/wallet"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="/seller/transactions"><i class="fas fa-exchange-alt"></i> Transaksi</a>
            <a href="/seller/withdraw" class="active"><i class="fas fa-arrow-up"></i> Withdraw</a>
            <a href="/seller/settings"><i class="fas fa-cog"></i> Pengaturan</a>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-wrapper">
        <main class="main-content">
            <div class="flex-between" style="margin-bottom:24px;">
                <div><h1 style="font-size:24px;">Withdraw</h1><p style="color:var(--text-secondary);">Tarik saldo Anda ke rekening atau e-wallet</p></div>
            </div>

            <div class="withdraw-grid">
                <div class="card">
                    <h4 style="margin-bottom:16px;">Form Withdraw</h4>
                    <div class="balance-box">
                        <div class="label">Saldo Tersedia</div>
                        <div class="value" id="availableBalance">Rp0</div>
                    </div>
                    <form id="withdrawForm">
                        <div class="input-group">
                            <label for="withdrawAmount">Nominal Withdraw *</label>
                            <input type="number" id="withdrawAmount" class="input" required placeholder="Minimal Rp50.000" min="50000">
                            <span class="hint" style="font-size:12px;color:var(--text-light);">Minimal: Rp50.000, Maksimal: Rp10.000.000</span>
                        </div>
                        <div class="input-group">
                            <label for="withdrawMethod">Metode Pembayaran *</label>
                            <select id="withdrawMethod" class="input" required>
                                <option value="">Pilih Metode</option>
                                <option value="DANA">DANA</option>
                                <option value="OVO">OVO</option>
                                <option value="GoPay">GoPay</option>
                                <option value="ShopeePay">ShopeePay</option>
                                <option value="Bank BCA">Bank BCA</option>
                                <option value="Bank BRI">Bank BRI</option>
                                <option value="Bank Mandiri">Bank Mandiri</option>
                                <option value="Bank BNI">Bank BNI</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="withdrawAccountNumber">Nomor Tujuan *</label>
                            <input type="text" id="withdrawAccountNumber" class="input" required placeholder="Nomor rekening/HP">
                        </div>
                        <div class="input-group">
                            <label for="withdrawAccountName">Nama Pemilik *</label>
                            <input type="text" id="withdrawAccountName" class="input" required placeholder="Nama sesuai rekening">
                        </div>
                        <div class="input-group">
                            <label for="withdrawNote">Catatan (Opsional)</label>
                            <textarea id="withdrawNote" class="input" rows="2" placeholder="Catatan tambahan"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-arrow-up"></i> Ajukan Withdraw</button>
                    </form>
                </div>

                <div class="card">
                    <h4 style="margin-bottom:16px;">Riwayat Withdraw</h4>
                    <div id="withdrawHistory" style="max-height:400px;overflow-y:auto;">
                        <div class="text-center text-secondary" style="padding:20px 0;">Memuat riwayat...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, onAuthStateChanged, signOut } from "firebase/auth";
        import { getFirestore, collection, doc, getDoc, getDocs, query, where, orderBy, limit, addDoc, serverTimestamp, onSnapshot } from "firebase/firestore";

        console.log('💰 [WITHDRAW] Page loaded');

        const firebaseConfig = {
            apiKey: "AIzaSyA-6Tqd5i20sCMixQccI5p1sOCgQWN88dE",
            authDomain: "productkuu.firebaseapp.com",
            projectId: "productkuu",
            storageBucket: "productkuu.firebasestorage.app",
            messagingSenderId: "6615996108",
            appId: "1:6615996108:web:daa6e17c1275d3061cd469",
            measurementId: "G-78ZPLZMFEJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Theme
        const themeToggle = document.getElementById('themeToggle');
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            localStorage.setItem('darkMode', darkMode);
            themeToggle.querySelector('i').className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
        });

        // Sidebar
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const sidebarToggle = document.getElementById('sidebarToggle');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                sidebarOverlay.classList.toggle('open');
            });
        }
        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', () => {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('open');
            });
        }

        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                if (href) window.location.href = href;
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try { await signOut(auth); window.location.href = '/'; } 
            catch (error) { showToast('error', 'Gagal logout'); }
        });

        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const colors = { success: 'var(--success)', error: 'var(--danger)', warning: 'var(--warning)', info: 'var(--info)' };
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = colors[type] || colors.info;
            toast.innerHTML = `
                <span class="toast-icon"><i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i></span>
                <div class="toast-content"><div class="toast-message">${message}</div></div>
                <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
        }

        function formatPrice(price) {
            if (!price && price !== 0) return '0';
            return new Intl.NumberFormat('id-ID').format(price);
        }

        function formatDate(date) {
            if (!date) return '-';
            const d = date instanceof Date ? date : new Date(date);
            return d.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '/seller/login'; return; }
            currentUser = user;
            const userRef = doc(db, 'users', user.uid);
            const userDoc = await getDoc(userRef);
            if (!userDoc.exists() || userDoc.data().role !== 'seller') { window.location.href = '/'; return; }
            await loadBalance(user.uid);
            await loadWithdrawHistory(user.uid);
            onSnapshot(query(collection(db, 'withdrawals'), where('sellerId', '==', user.uid)), () => loadWithdrawHistory(user.uid));
        });

        async function loadBalance(uid) {
            try {
                const userRef = doc(db, 'users', uid);
                const userDoc = await getDoc(userRef);
                if (userDoc.exists()) {
                    const wallet = userDoc.data().wallet || { available: 0 };
                    document.getElementById('availableBalance').textContent = `Rp${formatPrice(wallet.available || 0)}`;
                }
            } catch (error) { console.error('❌ [WITHDRAW] Error:', error); }
        }

        async function loadWithdrawHistory(uid) {
            try {
                const q = query(collection(db, 'withdrawals'), where('sellerId', '==', uid), orderBy('createdAt', 'desc'), limit(20));
                const snapshot = await getDocs(q);
                const container = document.getElementById('withdrawHistory');
                if (snapshot.empty) {
                    container.innerHTML = `<div class="text-center text-secondary" style="padding:20px 0;"><i class="fas fa-history" style="font-size:24px;display:block;margin-bottom:8px;"></i>Belum ada riwayat withdraw</div>`;
                    return;
                }
                const statusColors = { 'pending': 'badge-warning', 'approved': 'badge-success', 'rejected': 'badge-danger', 'processing': 'badge-info' };
                container.innerHTML = snapshot.docs.map(doc => {
                    const w = doc.data();
                    return `<div class="withdraw-item">
                        <div><strong style="font-size:16px;">Rp${formatPrice(w.amount)}</strong><br><span style="font-size:13px;color:var(--text-secondary);">${w.method} • ${w.accountNumber}</span><br><span style="font-size:12px;color:var(--text-light);">${formatDate(w.createdAt)}</span></div>
                        <div style="text-align:right;">
                            <span class="badge ${statusColors[w.status] || 'badge-info'}">${w.status}</span>
                            ${w.adminNote ? `<br><span style="font-size:12px;color:var(--text-secondary);">${w.adminNote}</span>` : ''}
                        </div>
                    </div>`;
                }).join('');
            } catch (error) { console.error('❌ [WITHDRAW] Error:', error); }
        }

        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('📤 [WITHDRAW] Form submitted');

            const amount = parseInt(document.getElementById('withdrawAmount').value);
            const method = document.getElementById('withdrawMethod').value;
            const accountNumber = document.getElementById('withdrawAccountNumber').value.trim();
            const accountName = document.getElementById('withdrawAccountName').value.trim();
            const note = document.getElementById('withdrawNote').value.trim();

            if (!amount || amount < 50000) { showToast('warning', 'Minimal withdraw Rp50.000'); return; }
            if (amount > 10000000) { showToast('warning', 'Maksimal withdraw Rp10.000.000'); return; }
            if (!method || !accountNumber || !accountName) { showToast('warning', 'Lengkapi data withdraw'); return; }

            try {
                const userRef = doc(db, 'users', currentUser.uid);
                const userDoc = await getDoc(userRef);
                const available = userDoc.data()?.wallet?.available || 0;
                if (amount > available) { showToast('error', 'Saldo tidak mencukupi'); return; }

                await addDoc(collection(db, 'withdrawals'), {
                    sellerId: currentUser.uid,
                    amount: amount,
                    method: method,
                    accountNumber: accountNumber,
                    accountName: accountName,
                    note: note,
                    status: 'pending',
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });
                showToast('success', 'Permintaan withdraw berhasil diajukan!');
                document.getElementById('withdrawForm').reset();
                await loadBalance(currentUser.uid);
                await loadWithdrawHistory(currentUser.uid);
            } catch (error) {
                console.error('❌ [WITHDRAW] Error:', error);
                showToast('error', 'Gagal mengajukan withdraw: ' + error.message);
            }
        });

        console.log('✅ [WITHDRAW] Page ready');
    </script>
</body>
</html>
