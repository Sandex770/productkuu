<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - ProductKuu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" href="../../assets/images/favicon.ico">
    <style>
        .withdraw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .withdraw-history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .withdraw-history-item:last-child { border-bottom: none; }
        @media (max-width: 768px) { .withdraw-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-logo"><i class="fas fa-cube"></i><span>ProductKuu</span></a>
            <div class="navbar-actions">
                <button class="btn-icon" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="btn-icon" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <aside class="sidebar" id="sidebar">
        <div style="padding: 0 12px 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px;">
            <div style="font-weight: 600; font-size: 14px; color: var(--text-secondary);">Menu Seller</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/seller/dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="/seller/products"><i class="fas fa-box"></i> Produk</a>
            <a href="/seller/wallet"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="/seller/transactions"><i class="fas fa-exchange-alt"></i> Transaksi</a>
            <a href="/seller/withdraw" class="active"><i class="fas fa-arrow-up"></i> Withdraw</a>
            <a href="/seller/settings"><i class="fas fa-cog"></i> Pengaturan</a>
            <button onclick="handleLogout()" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: none; background: none; width: 100%; border-radius: var(--radius); color: var(--danger); cursor: pointer; font-family: var(--font); font-size: 14px; font-weight: 500; margin-top: 8px;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <div><h1 style="font-size: 24px;">Withdraw</h1><p style="color: var(--text-secondary);">Tarik saldo Anda ke rekening atau e-wallet</p></div>
        </div>

        <div class="withdraw-grid">
            <div class="card">
                <h4 style="margin-bottom: 16px;">Form Withdraw</h4>
                <div style="padding: 12px 16px; background: rgba(79, 70, 229, 0.1); border-radius: var(--radius); margin-bottom: 16px;">
                    <span style="font-size: 13px; color: var(--text-secondary);">Saldo Tersedia</span>
                    <div style="font-size: 24px; font-weight: 700; color: var(--primary);" id="availableBalance">Rp0</div>
                </div>
                <form id="withdrawForm">
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="withdrawAmount">Nominal Withdraw *</label>
                        <input type="number" id="withdrawAmount" class="input" required placeholder="Minimal Rp50.000" min="50000">
                        <span class="hint">Minimal: Rp50.000, Maksimal: Rp10.000.000</span>
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="withdrawMethod">Metode Pembayaran *</label>
                        <select id="withdrawMethod" class="input" required>
                            <option value="">Pilih Metode</option>
                            <option value="DANA">DANA</option>
                            <option value="OVO">OVO</option>
                            <option value="GoPay">GoPay</option>
                            <option value="ShopeePay">ShopeePay</option>
                            <option value="Bank BCA">Bank BCA</option>
                            <option value="Bank BRI">Bank BRI</option>
                            <option value="Bank Mandiri">Bank Mandiri</option>
                            <option value="Bank BNI">Bank BNI</option>
                        </select>
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="withdrawAccountNumber">Nomor Tujuan *</label>
                        <input type="text" id="withdrawAccountNumber" class="input" required placeholder="Nomor rekening/HP">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="withdrawAccountName">Nama Pemilik *</label>
                        <input type="text" id="withdrawAccountName" class="input" required placeholder="Nama sesuai rekening">
                    </div>
                    <div class="input-group" style="margin-bottom: 16px;">
                        <label for="withdrawNote">Catatan (Opsional)</label>
                        <textarea id="withdrawNote" class="input" rows="2" placeholder="Catatan tambahan"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-arrow-up"></i> Ajukan Withdraw</button>
                </form>
            </div>

            <div class="card">
                <h4 style="margin-bottom: 16px;">Riwayat Withdraw</h4>
                <div id="withdrawHistory" style="max-height: 400px; overflow-y: auto;">
                    <div class="text-center" style="color: var(--text-secondary); padding: 20px 0;">Memuat riwayat...</div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { db, auth, collections, collection, doc, getDoc, getDocs, query, where, orderBy, limit, addDoc, serverTimestamp, onSnapshot, signOut } from '../../js/firebase-config.js';
        import { showToast, formatPrice, formatDate, navigate } from '../../js/app.js';

        let currentUser = null;

        // Theme
        const themeToggle = document.getElementById('themeToggle');
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            localStorage.setItem('darkMode', darkMode);
            themeToggle.querySelector('i').className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
        });

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        };

        document.addEventListener('DOMContentLoaded', async () => {
            auth.onAuthStateChanged(async (user) => {
                if (!user) { navigate('/seller/login'); return; }
                currentUser = user;
                await loadBalance(user.uid);
                await loadWithdrawHistory(user.uid);
                setupRealtimeListeners(user.uid);
            });
        });

        async function loadBalance(uid) {
            try {
                const userRef = doc(db, collections.users, uid);
                const userDoc = await getDoc(userRef);
                if (userDoc.exists) {
                    const wallet = userDoc.data().wallet || { available: 0 };
                    document.getElementById('availableBalance').textContent = `Rp${formatPrice(wallet.available || 0)}`;
                }
            } catch (error) { console.error('Error loading balance:', error); }
        }

        async function loadWithdrawHistory(uid) {
            try {
                const q = query(collection(db, collections.withdrawals), where('sellerId', '==', uid), orderBy('createdAt', 'desc'), limit(20));
                const snapshot = await getDocs(q);
                const container = document.getElementById('withdrawHistory');
                if (snapshot.empty) {
                    container.innerHTML = `<div class="text-center" style="color: var(--text-secondary); padding: 20px 0;"><i class="fas fa-history" style="font-size: 24px; display: block; margin-bottom: 8px;"></i>Belum ada riwayat withdraw</div>`;
                    return;
                }
                const statusColors = { 'pending': 'badge-warning', 'approved': 'badge-success', 'rejected': 'badge-danger', 'processing': 'badge-info' };
                container.innerHTML = snapshot.docs.map(doc => {
                    const w = doc.data();
                    return `<div class="withdraw-history-item">
                        <div><strong style="font-size: 16px;">Rp${formatPrice(w.amount)}</strong><br><span style="font-size: 13px; color: var(--text-secondary);">${w.method} • ${w.accountNumber}</span><br><span style="font-size: 12px; color: var(--text-light);">${formatDate(w.createdAt)}</span></div>
                        <div style="text-align: right;">
                            <span class="badge ${statusColors[w.status] || 'badge-info'}">${w.status}</span>
                            ${w.adminNote ? `<br><span style="font-size: 12px; color: var(--text-secondary);">${w.adminNote}</span>` : ''}
                        </div>
                    </div>`;
                }).join('');
            } catch (error) { console.error('Error loading withdraw history:', error); document.getElementById('withdrawHistory').innerHTML = '<div class="text-center" style="color: var(--danger);">Gagal memuat riwayat</div>'; }
        }

        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = parseInt(document.getElementById('withdrawAmount').value);
            const method = document.getElementById('withdrawMethod').value;
            const accountNumber = document.getElementById('withdrawAccountNumber').value.trim();
            const accountName = document.getElementById('withdrawAccountName').value.trim();
            const note = document.getElementById('withdrawNote').value.trim();
            if (!amount || amount < 50000) { showToast('warning', 'Minimal withdraw Rp50.000'); return; }
            if (amount > 10000000) { showToast('warning', 'Maksimal withdraw Rp10.000.000'); return; }
            if (!method || !accountNumber || !accountName) { showToast('warning', 'Lengkapi data withdraw'); return; }
            try {
                const userRef = doc(db, collections.users, currentUser.uid);
                const userDoc = await getDoc(userRef);
                const available = userDoc.data()?.wallet?.available || 0;
                if (amount > available) { showToast('error', 'Saldo tidak mencukupi'); return; }
                await addDoc(collection(db, collections.withdrawals), {
                    sellerId: currentUser.uid, amount, method, accountNumber, accountName, note,
                    status: 'pending', createdAt: serverTimestamp(), updatedAt: serverTimestamp()
                });
                showToast('success', 'Permintaan withdraw berhasil diajukan!');
                document.getElementById('withdrawForm').reset();
                await loadBalance(currentUser.uid);
                await loadWithdrawHistory(currentUser.uid);
            } catch (error) { console.error('Error submitting withdraw:', error); showToast('error', 'Gagal mengajukan withdraw'); }
        });

        function setupRealtimeListeners(uid) {
            onSnapshot(query(collection(db, collections.withdrawals), where('sellerId', '==', uid)), () => loadWithdrawHistory(uid));
        }

        window.handleLogout = async function() { try { await signOut(auth); showToast('success', 'Berhasil logout'); navigate('/'); } catch (error) { showToast('error', 'Gagal logout'); } };
        document.querySelectorAll('.sidebar-nav a').forEach(link => { link.addEventListener('click', function(e) { e.preventDefault(); navigate(this.getAttribute('href')); }); });
    </script>
</body>
</html>
