<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi - ProductKuu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/assets/images/favicon.ico">
    <style>
        /* ===== LAYOUT ===== */
        .app-wrapper { display: flex; min-height: calc(100vh - 64px); margin-top: 64px; }
        .sidebar { width: 260px; background: var(--bg-primary); border-right: 1px solid var(--border-color); padding: 20px 0; position: fixed; top: 64px; bottom: 0; overflow-y: auto; z-index: 100; transition: transform 0.3s ease; }
        .sidebar-header { padding: 0 16px 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
        .sidebar-header .title { font-weight: 600; font-size: 14px; color: var(--text-secondary); }
        .sidebar-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }
        .sidebar-nav a, .sidebar-nav button { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius); color: var(--text-secondary); transition: var(--transition); font-size: 14px; font-weight: 500; text-decoration: none; background: none; border: none; width: 100%; cursor: pointer; font-family: var(--font); text-align: left; }
        .sidebar-nav a:hover, .sidebar-nav button:hover { background: var(--bg-secondary); color: var(--text-primary); }
        .sidebar-nav a.active { background: rgba(79,70,229,0.1); color: var(--primary); }
        .sidebar-nav .logout-btn { color: var(--danger); margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 16px; }
        .sidebar-nav .logout-btn:hover { background: rgba(239,68,68,0.1); color: var(--danger); }
        .sidebar-overlay { display: none; position: fixed; top: 64px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; }
        .sidebar-overlay.open { display: block; }
        .main-content { margin-left: 260px; padding: 24px; flex: 1; min-height: calc(100vh - 64px); }
        .mobile-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--text-primary); cursor: pointer; padding: 8px; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); width: 280px; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 16px; } .mobile-toggle { display: block !important; } }
        
        /* ===== TABLE ===== */
        .table-wrapper { overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; }
        .table th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); border-bottom: 2px solid var(--border-color); background: var(--bg-secondary); }
        .table td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .table tr:hover td { background: var(--bg-secondary); }
        .filter-bar { background: var(--bg-primary); border-radius: var(--radius); padding: 16px 20px; border: 1px solid var(--border-color); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 24px; }
        .filter-bar .filter-group { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
        .filter-bar .filter-group select, .filter-bar .filter-group input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius); background: var(--bg-secondary); color: var(--text-primary); font-family: var(--font); font-size: 13px; min-width: 120px; }
        .filter-bar .filter-actions { display: flex; gap: 8px; }
        .card { background: var(--bg-primary); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
        .badge-success { background: rgba(16,185,129,0.1); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,0.1); color: var(--warning); }
        .badge-danger { background: rgba(239,68,68,0.1); color: var(--danger); }
        .badge-info { background: rgba(59,130,246,0.1); color: var(--info); }
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 12px; max-width: 400px; width: 100%; }
        .toast { padding: 16px 20px; border-radius: var(--radius); background: var(--bg-primary); box-shadow: var(--shadow-lg); border-left: 4px solid var(--primary); animation: slideInRight 0.3s ease; display: flex; align-items: center; gap: 12px; }
        .toast-icon { font-size: 20px; }
        .toast-content { flex: 1; }
        .toast-message { font-size: 13px; color: var(--text-secondary); }
        .toast-close { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 16px; padding: 4px; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .text-center { text-align: center; }
        .text-secondary { color: var(--text-secondary); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-logo"><i class="fas fa-cube"></i><span>ProductKuu</span></a>
            <div class="navbar-actions">
                <button class="btn-icon" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="mobile-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="title">Menu Seller</div></div>
        <nav class="sidebar-nav">
            <a href="/seller/dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="/seller/products"><i class="fas fa-box"></i> Produk</a>
            <a href="/seller/wallet"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="/seller/transactions" class="active"><i class="fas fa-exchange-alt"></i> Transaksi</a>
            <a href="/seller/withdraw"><i class="fas fa-arrow-up"></i> Withdraw</a>
            <a href="/seller/settings"><i class="fas fa-cog"></i> Pengaturan</a>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-wrapper">
        <main class="main-content">
            <div class="flex-between" style="margin-bottom:24px;">
                <div><h1 style="font-size:24px;">Riwayat Transaksi</h1><p style="color:var(--text-secondary);">Semua transaksi penjualan Anda</p></div>
            </div>

            <div class="filter-bar">
                <div class="filter-group">
                    <select id="filterStatus"><option value="all">Semua Status</option><option value="pending">Pending</option><option value="settlement">Settlement</option><option value="failed">Failed</option><option value="expire">Expired</option></select>
                    <input type="date" id="filterDateFrom">
                    <input type="date" id="filterDateTo">
                </div>
                <div class="filter-actions">
                    <button onclick="applyFilters()" class="btn btn-secondary btn-sm"><i class="fas fa-filter"></i> Filter</button>
                    <button onclick="resetFilters()" class="btn btn-secondary btn-sm"><i class="fas fa-undo"></i></button>
                </div>
            </div>

            <div class="card">
                <div class="table-wrapper">
                    <table class="table">
                        <thead><tr><th>Order ID</th><th>Produk</th><th>Buyer</th><th>Harga</th><th>Komisi</th><th>Status</th><th>Tanggal</th></tr></thead>
                        <tbody id="transactionsBody"><tr><td colspan="7" class="text-center text-secondary" style="padding:40px 0;">Memuat transaksi...</td></tr></tbody>
                    </table>
                </div>
                <div id="pagination" style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;"></div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, onAuthStateChanged, signOut } from "firebase/auth";
        import { getFirestore, collection, doc, getDoc, getDocs, query, where, orderBy, limit, startAfter, onSnapshot } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyA-6Tqd5i20sCMixQccI5p1sOCgQWN88dE",
            authDomain: "productkuu.firebaseapp.com",
            projectId: "productkuu",
            storageBucket: "productkuu.firebasestorage.app",
            messagingSenderId: "6615996108",
            appId: "1:6615996108:web:daa6e17c1275d3061cd469",
            measurementId: "G-78ZPLZMFEJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;
        let transactions = [], lastDoc = null, hasMore = true, currentPage = 1, limitPerPage = 20;

        // Theme
        const themeToggle = document.getElementById('themeToggle');
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            localStorage.setItem('darkMode', darkMode);
            themeToggle.querySelector('i').className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
        });

        // Sidebar
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        document.getElementById('sidebarToggle').addEventListener('click', () => { sidebar.classList.toggle('open'); sidebarOverlay.classList.toggle('open'); });
        sidebarOverlay.addEventListener('click', () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); });
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', function(e) { e.preventDefault(); const href = this.getAttribute('href'); if (href) window.location.href = href; });
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => { try { await signOut(auth); window.location.href = '/'; } catch (error) { showToast('error', 'Gagal logout'); } });

        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const colors = { success: 'var(--success)', error: 'var(--danger)', warning: 'var(--warning)', info: 'var(--info)' };
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = colors[type] || colors.info;
            toast.innerHTML = `<span class="toast-icon"><i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i></span><div class="toast-content"><div class="toast-message">${message}</div></div><button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>`;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
        }

        function formatPrice(price) { if (!price && price !== 0) return '0'; return new Intl.NumberFormat('id-ID').format(price); }
        function formatDate(date) { if (!date) return '-'; const d = date instanceof Date ? date : new Date(date); return d.toLocaleDateString('id-ID', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }); }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '/seller/login'; return; }
            currentUser = user;
            const userRef = doc(db, 'users', user.uid);
            const userDoc = await getDoc(userRef);
            if (!userDoc.exists() || userDoc.data().role !== 'seller') { window.location.href = '/'; return; }
            await loadTransactions(true);
            onSnapshot(query(collection(db, 'orders'), where('sellerId', '==', user.uid)), () => loadTransactions(true));
        });

        async function loadTransactions(reset = true) {
            if (!currentUser) return;
            try {
                if (reset) { lastDoc = null; hasMore = true; transactions = []; currentPage = 1; }
                if (!hasMore) return;
                let constraints = [where('sellerId', '==', currentUser.uid), orderBy('createdAt', 'desc')];
                const status = document.getElementById('filterStatus').value;
                if (status !== 'all') constraints.push(where('paymentStatus', '==', status));
                let q = query(collection(db, 'orders'), ...constraints, limit(limitPerPage));
                if (lastDoc) q = query(collection(db, 'orders'), ...constraints, startAfter(lastDoc), limit(limitPerPage));
                const snapshot = await getDocs(q);
                if (snapshot.empty) { hasMore = false; if (reset) document.getElementById('transactionsBody').innerHTML = '<tr><td colspan="7" class="text-center text-secondary">Belum ada transaksi</td></tr>'; return; }
                lastDoc = snapshot.docs[snapshot.docs.length - 1];
                hasMore = snapshot.docs.length === limitPerPage;
                const newData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                transactions = reset ? newData : [...transactions, ...newData];
                renderTransactions();
            } catch (error) { console.error('Error loading transactions:', error); showToast('error', 'Gagal memuat transaksi'); }
        }

        function renderTransactions() {
            const tbody = document.getElementById('transactionsBody');
            if (transactions.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-secondary">Tidak ada transaksi</td></tr>'; document.getElementById('pagination').innerHTML = ''; return; }
            const statusColors = { 'pending': 'badge-warning', 'settlement': 'badge-success', 'failed': 'badge-danger', 'expire': 'badge-danger' };
            tbody.innerHTML = transactions.map(t => {
                const commission = Math.round((t.amount || 0) * 0.1);
                return `<tr>
                    <td style="font-family:monospace;font-size:13px;">${t.orderId || '-'}</td>
                    <td>${t.productName || '-'}</td>
                    <td>${t.buyerName || '-'}</td>
                    <td style="font-weight:600;color:var(--primary);">Rp${formatPrice(t.amount)}</td>
                    <td style="color:var(--danger);">Rp${formatPrice(commission)}</td>
                    <td><span class="badge ${statusColors[t.paymentStatus] || 'badge-info'}">${t.paymentStatus || t.status}</span></td>
                    <td style="font-size:13px;color:var(--text-secondary);">${formatDate(t.createdAt)}</td>
                </tr>`;
            }).join('');
            renderPagination();
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            if (!hasMore && transactions.length <= limitPerPage) { container.innerHTML = ''; return; }
            container.innerHTML = `<span style="font-size:14px;color:var(--text-secondary);">${transactions.length} transaksi</span><div style="display:flex;gap:8px;">${currentPage > 1 ? `<button onclick="loadPreviousPage()" class="btn btn-secondary btn-sm"><i class="fas fa-chevron-left"></i> Sebelumnya</button>` : ''}${hasMore ? `<button onclick="loadNextPage()" class="btn btn-secondary btn-sm">Selanjutnya <i class="fas fa-chevron-right"></i></button>` : ''}</div>`;
        }

        window.loadNextPage = function() { currentPage++; loadTransactions(false); };
        window.loadPreviousPage = function() { if (currentPage <= 1) return; currentPage--; lastDoc = null; hasMore = true; loadTransactions(true); };
        window.applyFilters = function() { lastDoc = null; hasMore = true; loadTransactions(true); };
        window.resetFilters = function() { document.getElementById('filterStatus').value = 'all'; document.getElementById('filterDateFrom').value = ''; document.getElementById('filterDateTo').value = ''; applyFilters(); };

        console.log('📊 Transactions page loaded!');
    </script>
</body>
</html>
