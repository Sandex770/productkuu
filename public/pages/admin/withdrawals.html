<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Withdraw - ProductKuu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/assets/images/favicon.ico">
    <style>
        .app-wrapper { display: flex; min-height: calc(100vh - 64px); margin-top: 64px; }
        .sidebar { width: 260px; background: var(--bg-primary); border-right: 1px solid var(--border-color); padding: 20px 0; position: fixed; top: 64px; bottom: 0; overflow-y: auto; z-index: 100; transition: transform 0.3s ease; }
        .sidebar-header { padding: 0 16px 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
        .sidebar-header .title { font-weight: 600; font-size: 14px; color: var(--text-secondary); }
        .sidebar-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }
        .sidebar-nav a, .sidebar-nav button { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius); color: var(--text-secondary); transition: var(--transition); font-size: 14px; font-weight: 500; text-decoration: none; background: none; border: none; width: 100%; cursor: pointer; font-family: var(--font); text-align: left; }
        .sidebar-nav a:hover, .sidebar-nav button:hover { background: var(--bg-secondary); color: var(--text-primary); }
        .sidebar-nav a.active { background: rgba(79,70,229,0.1); color: var(--primary); }
        .sidebar-nav .logout-btn { color: var(--danger); margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 16px; }
        .sidebar-nav .logout-btn:hover { background: rgba(239,68,68,0.1); color: var(--danger); }
        .sidebar-overlay { display: none; position: fixed; top: 64px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; }
        .sidebar-overlay.open { display: block; }
        .main-content { margin-left: 260px; padding: 24px; flex: 1; min-height: calc(100vh - 64px); }
        .mobile-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--text-primary); cursor: pointer; padding: 8px; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); width: 280px; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 16px; } .mobile-toggle { display: block !important; } }
        
        .table-wrapper { overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; }
        .table th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); border-bottom: 2px solid var(--border-color); background: var(--bg-secondary); }
        .table td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .table tr:hover td { background: var(--bg-secondary); }
        .filter-bar { background: var(--bg-primary); border-radius: var(--radius); padding: 16px 20px; border: 1px solid var(--border-color); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 24px; }
        .filter-bar .filter-group { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
        .filter-bar .filter-group select, .filter-bar .filter-group input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius); background: var(--bg-secondary); color: var(--text-primary); font-family: var(--font); font-size: 13px; min-width: 120px; }
        .filter-bar .filter-actions { display: flex; gap: 8px; }
        .card { background: var(--bg-primary); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
        .badge-success { background: rgba(16,185,129,0.1); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,0.1); color: var(--warning); }
        .badge-danger { background: rgba(239,68,68,0.1); color: var(--danger); }
        .badge-info { background: rgba(59,130,246,0.1); color: var(--info); }
        .badge-primary { background: rgba(79,70,229,0.1); color: var(--primary); }
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 12px; max-width: 400px; width: 100%; }
        .toast { padding: 16px 20px; border-radius: var(--radius); background: var(--bg-primary); box-shadow: var(--shadow-lg); border-left: 4px solid var(--primary); animation: slideInRight 0.3s ease; display: flex; align-items: center; gap: 12px; }
        .toast-icon { font-size: 20px; }
        .toast-content { flex: 1; }
        .toast-message { font-size: 13px; color: var(--text-secondary); }
        .toast-close { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 16px; padding: 4px; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .text-center { text-align: center; }
        .text-secondary { color: var(--text-secondary); }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: none; border-radius: 12px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { transform: translateY(-2px); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { transform: translateY(-2px); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-color); transform: translateY(-2px); }
        .btn-sm { padding: 8px 16px; font-size: 12px; }
        .modal-overlay { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; animation: fadeIn 0.3s ease; }
        .modal { background: var(--bg-primary); border-radius: var(--radius-lg); padding: 32px; max-width: 400px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; animation: slideUp 0.3s ease; text-align: center; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        .modal p { color: var(--text-secondary); margin-bottom: 24px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-logo"><i class="fas fa-cube"></i><span>ProductKuu</span></a>
            <div class="navbar-actions">
                <span class="badge badge-primary" style="font-size:11px;">Admin</span>
                <button class="btn-icon" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="mobile-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="title">Menu Admin</div></div>
        <nav class="sidebar-nav">
            <a href="/admin/dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="/admin/sellers"><i class="fas fa-users"></i> Seller</a>
            <a href="/admin/products"><i class="fas fa-box"></i> Produk</a>
            <a href="/admin/orders"><i class="fas fa-shopping-cart"></i> Order</a>
            <a href="/admin/banners"><i class="fas fa-images"></i> Banner</a>
            <a href="/admin/withdrawals" class="active"><i class="fas fa-arrow-up"></i> Withdraw</a>
            <a href="/admin/settings"><i class="fas fa-cog"></i> Pengaturan</a>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-wrapper">
        <main class="main-content">
            <div class="flex-between" style="margin-bottom:24px;">
                <div><h1 style="font-size:24px;">Manajemen Withdraw</h1><p style="color:var(--text-secondary);">Kelola semua permintaan withdraw</p></div>
            </div>

            <div class="filter-bar">
                <div class="filter-group">
                    <select id="filterStatus">
                        <option value="all">Semua Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                        <option value="processing">Processing</option>
                    </select>
                    <input type="date" id="filterDateFrom">
                    <input type="date" id="filterDateTo">
                </div>
                <div class="filter-actions">
                    <button onclick="applyFilters()" class="btn btn-secondary btn-sm"><i class="fas fa-filter"></i> Filter</button>
                    <button onclick="resetFilters()" class="btn btn-secondary btn-sm"><i class="fas fa-undo"></i></button>
                </div>
            </div>

            <div class="card">
                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Seller</th>
                                <th>Metode</th>
                                <th>Nomor Tujuan</th>
                                <th>Nama</th>
                                <th>Nominal</th>
                                <th>Status</th>
                                <th>Tanggal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="withdrawalsTableBody">
                            <tr><td colspan="8" class="text-center text-secondary" style="padding:40px 0;">Memuat withdraw...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination" style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;"></div>
            </div>
        </main>
    </div>

    <!-- Action Modal -->
    <div class="modal-overlay" id="actionModal">
        <div class="modal">
            <h3 class="modal-title" id="actionModalTitle">Approve Withdraw</h3>
            <p id="actionModalMessage">Apakah Anda yakin ingin menyetujui permintaan withdraw ini?</p>
            <div style="display:flex;gap:12px;">
                <button onclick="confirmWithdrawAction()" class="btn btn-success" style="flex:1;" id="actionConfirmBtn"><i class="fas fa-check"></i> Ya</button>
                <button onclick="closeActionModal()" class="btn btn-secondary" style="flex:1;">Batal</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, onAuthStateChanged, signOut } from "firebase/auth";
        import { getFirestore, collection, doc, getDoc, getDocs, query, where, orderBy, limit, startAfter, updateDoc, onSnapshot } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyA-6Tqd5i20sCMixQccI5p1sOCgQWN88dE",
            authDomain: "productkuu.firebaseapp.com",
            projectId: "productkuu",
            storageBucket: "productkuu.firebasestorage.app",
            messagingSenderId: "6615996108",
            appId: "1:6615996108:web:daa6e17c1275d3061cd469",
            measurementId: "G-78ZPLZMFEJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;
        let withdrawals = [], lastDoc = null, hasMore = true, currentPage = 1, actionId = null, actionType = null, limitPerPage = 20;

        // Theme
        const themeToggle = document.getElementById('themeToggle');
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            localStorage.setItem('darkMode', darkMode);
            themeToggle.querySelector('i').className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
        });

        // Sidebar
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        document.getElementById('sidebarToggle').addEventListener('click', () => { 
            sidebar.classList.toggle('open'); 
            sidebarOverlay.classList.toggle('open'); 
        });
        sidebarOverlay.addEventListener('click', () => { 
            sidebar.classList.remove('open'); 
            sidebarOverlay.classList.remove('open'); 
        });

        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                if (href) window.location.href = href;
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try { await signOut(auth); window.location.href = '/'; } 
            catch (error) { showToast('error', 'Gagal logout'); }
        });

        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const colors = { success: 'var(--success)', error: 'var(--danger)', warning: 'var(--warning)', info: 'var(--info)' };
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = colors[type] || colors.info;
            toast.innerHTML = `
                <span class="toast-icon"><i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i></span>
                <div class="toast-content"><div class="toast-message">${message}</div></div>
                <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
        }
        window.showToast = showToast;

        function formatPrice(price) { if (!price && price !== 0) return '0'; return new Intl.NumberFormat('id-ID').format(price); }
        function formatDate(date) { if (!date) return '-'; const d = date instanceof Date ? date : new Date(date); return d.toLocaleDateString('id-ID', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }); }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '/admin/login'; return; }
            currentUser = user;
            const userRef = doc(db, 'users', user.uid);
            const userDoc = await getDoc(userRef);
            if (!userDoc.exists() || userDoc.data().role !== 'admin') { window.location.href = '/'; return; }
            await loadWithdrawals(true);
            onSnapshot(collection(db, 'withdrawals'), () => loadWithdrawals(true));
        });

        async function loadWithdrawals(reset = true) {
            try {
                if (reset) { lastDoc = null; hasMore = true; withdrawals = []; currentPage = 1; }
                if (!hasMore) return;
                
                let constraints = [orderBy('createdAt', 'desc')];
                const status = document.getElementById('filterStatus').value;
                if (status !== 'all') constraints.push(where('status', '==', status));
                
                let q = query(collection(db, 'withdrawals'), ...constraints, limit(limitPerPage));
                if (lastDoc) q = query(collection(db, 'withdrawals'), ...constraints, startAfter(lastDoc), limit(limitPerPage));
                
                const snapshot = await getDocs(q);
                if (snapshot.empty) { 
                    hasMore = false; 
                    if (reset) {
                        document.getElementById('withdrawalsTableBody').innerHTML = 
                            '<tr><td colspan="8" class="text-center text-secondary">Belum ada withdraw</td></tr>';
                    }
                    return; 
                }
                
                lastDoc = snapshot.docs[snapshot.docs.length - 1];
                hasMore = snapshot.docs.length === limitPerPage;
                
                const newData = [];
                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    let sellerName = 'Unknown';
                    if (data.sellerId) {
                        const sellerRef = doc(db, 'users', data.sellerId);
                        const sellerDoc = await getDoc(sellerRef);
                        if (sellerDoc.exists()) {
                            sellerName = sellerDoc.data().storeName || sellerDoc.data().displayName || 'Seller';
                        }
                    }
                    newData.push({ id: doc.id, ...data, sellerName });
                }
                withdrawals = reset ? newData : [...withdrawals, ...newData];
                renderWithdrawals();
            } catch (error) { 
                console.error('Error loading withdrawals:', error); 
                showToast('error', 'Gagal memuat withdraw'); 
            }
        }

        function renderWithdrawals() {
            const tbody = document.getElementById('withdrawalsTableBody');
            if (withdrawals.length === 0) { 
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-secondary">Tidak ada withdraw</td></tr>'; 
                document.getElementById('pagination').innerHTML = ''; 
                return; 
            }
            
            const statusColors = { 
                'pending': 'badge-warning', 
                'approved': 'badge-success', 
                'rejected': 'badge-danger', 
                'processing': 'badge-info' 
            };

            tbody.innerHTML = withdrawals.map(w => `
                <tr>
                    <td><strong>${w.sellerName}</strong></td>
                    <td>${w.method}</td>
                    <td>${w.accountNumber}</td>
                    <td>${w.accountName}</td>
                    <td style="font-weight:600;color:${w.status === 'pending' ? 'var(--danger)' : 'var(--primary)'};">Rp${formatPrice(w.amount)}</td>
                    <td><span class="badge ${statusColors[w.status] || 'badge-info'}">${w.status}</span></td>
                    <td style="font-size:13px;color:var(--text-secondary);">${formatDate(w.createdAt)}</td>
                    <td>
                        ${w.status === 'pending' ? `
                            <button onclick="approveWithdraw('${w.id}')" class="btn btn-success btn-sm" style="padding:4px 8px;" title="Approve"><i class="fas fa-check"></i></button>
                            <button onclick="rejectWithdraw('${w.id}')" class="btn btn-danger btn-sm" style="padding:4px 8px;" title="Reject"><i class="fas fa-times"></i></button>
                        ` : ''}
                        ${w.adminNote ? `<span style="font-size:11px;color:var(--text-light);display:block;">${w.adminNote}</span>` : ''}
                    </td>
                </tr>
            `).join('');
            
            renderPagination();
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            if (!hasMore && withdrawals.length <= limitPerPage) { 
                container.innerHTML = ''; 
                return; 
            }
            container.innerHTML = `
                <span style="font-size:14px;color:var(--text-secondary);">${withdrawals.length} withdraw</span>
                <div style="display:flex;gap:8px;">
                    ${currentPage > 1 ? `<button onclick="loadPreviousPage()" class="btn btn-secondary btn-sm"><i class="fas fa-chevron-left"></i> Sebelumnya</button>` : ''}
                    ${hasMore ? `<button onclick="loadNextPage()" class="btn btn-secondary btn-sm">Selanjutnya <i class="fas fa-chevron-right"></i></button>` : ''}
                </div>
            `;
        }

        window.loadNextPage = function() { 
            currentPage++; 
            loadWithdrawals(false); 
        };

        window.loadPreviousPage = function() { 
            if (currentPage <= 1) return; 
            currentPage--; 
            lastDoc = null; 
            hasMore = true; 
            loadWithdrawals(true); 
        };

        window.applyFilters = function() { 
            lastDoc = null; 
            hasMore = true; 
            loadWithdrawals(true); 
        };

        window.resetFilters = function() { 
            document.getElementById('filterStatus').value = 'all'; 
            document.getElementById('filterDateFrom').value = ''; 
            document.getElementById('filterDateTo').value = ''; 
            applyFilters(); 
        };

        window.approveWithdraw = function(id) {
            actionId = id;
            actionType = 'approve';
            document.getElementById('actionModalTitle').textContent = 'Approve Withdraw';
            document.getElementById('actionModalMessage').textContent = 'Apakah Anda yakin ingin menyetujui permintaan withdraw ini?';
            document.getElementById('actionConfirmBtn').className = 'btn btn-success';
            document.getElementById('actionConfirmBtn').innerHTML = '<i class="fas fa-check"></i> Approve';
            document.getElementById('actionModal').classList.add('open');
        };

        window.rejectWithdraw = function(id) {
            const note = prompt('Alasan penolakan:');
            if (note === null) return;
            actionId = id;
            actionType = 'reject';
            document.getElementById('actionModalTitle').textContent = 'Reject Withdraw';
            document.getElementById('actionModalMessage').textContent = 'Apakah Anda yakin ingin menolak permintaan withdraw ini?';
            document.getElementById('actionConfirmBtn').className = 'btn btn-danger';
            document.getElementById('actionConfirmBtn').innerHTML = '<i class="fas fa-times"></i> Reject';
            document.getElementById('actionModal').classList.add('open');
            document.getElementById('actionModal').dataset.note = note;
        };

        window.closeActionModal = function() { 
            document.getElementById('actionModal').classList.remove('open'); 
            actionId = null; 
            actionType = null; 
        };

        window.confirmWithdrawAction = async function() {
            if (!actionId || !actionType) return;
            try {
                const note = document.getElementById('actionModal').dataset.note || (actionType === 'approve' ? 'Disetujui admin' : 'Ditolak admin');
                const response = await fetch(`/api/admin/withdrawals/${actionId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        status: actionType === 'approve' ? 'approved' : 'rejected',
                        adminNote: note
                    })
                });
                if (!response.ok) throw new Error('Gagal memproses withdraw');
                showToast('success', `Withdraw ${actionType === 'approve' ? 'disetujui' : 'ditolak'}`);
                closeActionModal();
                loadWithdrawals(true);
            } catch (error) {
                console.error('Error processing withdrawal:', error);
                showToast('error', error.message);
            }
        };

        console.log('💰 Admin Withdrawals page loaded!');
    </script>
</body>
</html>
