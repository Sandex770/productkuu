<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Banner - ProductKuu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/assets/images/favicon.ico">
    <style>
        .app-wrapper { display: flex; min-height: calc(100vh - 64px); margin-top: 64px; }
        .sidebar { width: 260px; background: var(--bg-primary); border-right: 1px solid var(--border-color); padding: 20px 0; position: fixed; top: 64px; bottom: 0; overflow-y: auto; z-index: 100; transition: transform 0.3s ease; }
        .sidebar-header { padding: 0 16px 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
        .sidebar-header .title { font-weight: 600; font-size: 14px; color: var(--text-secondary); }
        .sidebar-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }
        .sidebar-nav a, .sidebar-nav button { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius); color: var(--text-secondary); transition: var(--transition); font-size: 14px; font-weight: 500; text-decoration: none; background: none; border: none; width: 100%; cursor: pointer; font-family: var(--font); text-align: left; }
        .sidebar-nav a:hover, .sidebar-nav button:hover { background: var(--bg-secondary); color: var(--text-primary); }
        .sidebar-nav a.active { background: rgba(79,70,229,0.1); color: var(--primary); }
        .sidebar-nav .logout-btn { color: var(--danger); margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 16px; }
        .sidebar-nav .logout-btn:hover { background: rgba(239,68,68,0.1); color: var(--danger); }
        .sidebar-overlay { display: none; position: fixed; top: 64px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; }
        .sidebar-overlay.open { display: block; }
        .main-content { margin-left: 260px; padding: 24px; flex: 1; min-height: calc(100vh - 64px); }
        .mobile-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--text-primary); cursor: pointer; padding: 8px; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); width: 280px; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 16px; } .mobile-toggle { display: block !important; } }
        
        .banner-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .banner-card { background: var(--bg-primary); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-color); }
        .banner-card .banner-image { aspect-ratio: 16/9; background: linear-gradient(135deg, #4F46E5, #7C3AED); display: flex; align-items: center; justify-content: center; font-size: 48px; color: rgba(255,255,255,0.3); }
        .banner-card .banner-body { padding: 16px; }
        .banner-card .banner-actions { display: flex; gap: 8px; margin-top: 12px; }
        
        .card { background: var(--bg-primary); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
        .badge-success { background: rgba(16,185,129,0.1); color: var(--success); }
        .badge-danger { background: rgba(239,68,68,0.1); color: var(--danger); }
        .badge-primary { background: rgba(79,70,229,0.1); color: var(--primary); }
        
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: none; border-radius: 12px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, #4F46E5, #7C3AED); color: white; box-shadow: 0 4px 14px rgba(79,70,229,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,70,229,0.4); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-color); transform: translateY(-2px); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { transform: translateY(-2px); }
        .btn-sm { padding: 8px 16px; font-size: 12px; }
        .btn-block { width: 100%; justify-content: center; }
        
        .input { width: 100%; padding: 12px 16px; border: 2px solid var(--border-color); border-radius: var(--radius); font-family: var(--font); font-size: 14px; transition: all 0.3s; background: var(--bg-primary); color: var(--text-primary); }
        .input:focus { outline: none; border-color: #4F46E5; box-shadow: 0 0 0 4px rgba(79,70,229,0.1); }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .input-group label { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        
        .modal-overlay { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; animation: fadeIn 0.3s ease; }
        .modal { background: var(--bg-primary); border-radius: var(--radius-lg); padding: 32px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; animation: slideUp 0.3s ease; }
        .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 24px; color: var(--text-secondary); cursor: pointer; transition: all 0.3s; padding: 4px; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .text-center { text-align: center; }
        .text-secondary { color: var(--text-secondary); }
        
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 12px; max-width: 400px; width: 100%; }
        .toast { padding: 16px 20px; border-radius: var(--radius); background: var(--bg-primary); box-shadow: var(--shadow-lg); border-left: 4px solid var(--primary); animation: slideInRight 0.3s ease; display: flex; align-items: center; gap: 12px; }
        .toast-icon { font-size: 20px; }
        .toast-content { flex: 1; }
        .toast-message { font-size: 13px; color: var(--text-secondary); }
        .toast-close { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 16px; padding: 4px; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        
        /* ============================================
           DEBUG BOX
           ============================================ */
        .debug-box {
            background: #1E1E2E;
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 16px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #CDD6F4;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            border: 1px solid #313244;
        }
        .debug-box.show { display: block; }
        .debug-box .debug-line { padding: 2px 0; border-bottom: 1px solid #2A2A3E; }
        .debug-box .debug-line:last-child { border-bottom: none; }
        .debug-box .debug-success { color: #A6E3A1; }
        .debug-box .debug-error { color: #F38BA8; }
        .debug-box .debug-info { color: #89B4FA; }
        .debug-box .debug-warning { color: #F9E2AF; }
        
        .debug-toggle { 
            background: none; 
            border: none; 
            color: var(--text-light); 
            cursor: pointer; 
            font-size: 12px; 
            text-decoration: underline;
            padding: 4px 8px;
            margin-bottom: 8px;
        }
        .debug-toggle:hover { color: var(--text-primary); }
        
        .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; display: none; }
        .error-box.show { display: block; }
        .error-box .error-title { font-weight: 700; color: var(--danger); }
        .error-box .error-detail { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        
        @media (max-width: 1024px) { .banner-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px) { .banner-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-logo"><i class="fas fa-cube"></i><span>ProductKuu</span></a>
            <div class="navbar-actions">
                <span class="badge badge-primary" style="font-size:11px;">Admin</span>
                <button class="btn-icon" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="mobile-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="title">Menu Admin</div></div>
        <nav class="sidebar-nav">
            <a href="/admin/dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="/admin/sellers"><i class="fas fa-users"></i> Seller</a>
            <a href="/admin/products"><i class="fas fa-box"></i> Produk</a>
            <a href="/admin/orders"><i class="fas fa-shopping-cart"></i> Order</a>
            <a href="/admin/banners" class="active"><i class="fas fa-images"></i> Banner</a>
            <a href="/admin/withdrawals"><i class="fas fa-arrow-up"></i> Withdraw</a>
            <a href="/admin/settings"><i class="fas fa-cog"></i> Pengaturan</a>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- MAIN CONTENT -->
    <div class="app-wrapper">
        <main class="main-content">
            <div class="flex-between" style="margin-bottom:24px;">
                <div><h1 style="font-size:24px;">Manajemen Banner</h1><p style="color:var(--text-secondary);">Kelola semua banner di homepage</p></div>
                <button onclick="openBannerSettings()" class="btn btn-secondary"><i class="fas fa-cog"></i> Pengaturan Banner</button>
            </div>

            <!-- Debug Box -->
            <div class="debug-box" id="debugBox">
                <div class="debug-line debug-info">🔍 Debug Mode Active</div>
                <div class="debug-line" id="debugLog">Menunggu data...</div>
            </div>
            <button class="debug-toggle" onclick="toggleDebug()">
                <i class="fas fa-bug"></i> Toggle Debug
            </button>

            <!-- Error Box -->
            <div class="error-box" id="errorBox">
                <div class="error-title"><i class="fas fa-exclamation-circle"></i> <span id="errorTitle">Gagal Memuat Data</span></div>
                <div class="error-detail" id="errorDetail">Terjadi kesalahan saat memuat data.</div>
            </div>

            <!-- Banners Grid -->
            <div class="banner-grid" id="bannersGrid" style="margin-top:8px;">
                <div class="text-center text-secondary" style="grid-column:1/-1;padding:40px 0;">
                    <i class="fas fa-spinner fa-spin" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                    Memuat banner...
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <button class="modal-close" onclick="closeSettingsModal()"><i class="fas fa-times"></i></button>
            <h3 class="modal-title">Pengaturan Banner</h3>
            <form id="settingsForm">
                <div class="input-group">
                    <label for="bannerPrice">Harga Banner (Rp)</label>
                    <input type="number" id="bannerPrice" class="input" placeholder="100000" min="1000">
                </div>
                <div class="input-group">
                    <label for="bannerDuration">Durasi Banner (Jam)</label>
                    <input type="number" id="bannerDuration" class="input" placeholder="24" min="1">
                </div>
                <div class="input-group">
                    <label for="maxBanners">Max Slot Banner</label>
                    <input type="number" id="maxBanners" class="input" placeholder="5" min="1">
                </div>
                <div class="input-group">
                    <label for="autoSlideSpeed">Kecepatan Auto Slide (detik)</label>
                    <input type="number" id="autoSlideSpeed" class="input" placeholder="5" min="1">
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> Simpan Pengaturan</button>
            </form>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        // ============================================
        // IMPORTS
        // ============================================
        import { initializeApp } from "firebase/app";
        import { getAuth, onAuthStateChanged, signOut } from "firebase/auth";
        import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp } from "firebase/firestore";

        console.log('🖼️ [ADMIN_BANNERS] Page loaded');

        // ============================================
        // FIREBASE CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA-6Tqd5i20sCMixQccI5p1sOCgQWN88dE",
            authDomain: "productkuu.firebaseapp.com",
            projectId: "productkuu",
            storageBucket: "productkuu.firebasestorage.app",
            messagingSenderId: "6615996108",
            appId: "1:6615996108:web:daa6e17c1275d3061cd469",
            measurementId: "G-78ZPLZMFEJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log('✅ [ADMIN_BANNERS] Firebase initialized');

        let currentUser = null;

        // ============================================
        // DEBUG LOG
        // ============================================
        let debugVisible = false;

        function addDebug(message, type = 'info') {
            const colors = {
                success: 'debug-success',
                error: 'debug-error',
                info: 'debug-info',
                warning: 'debug-warning'
            };
            const icons = {
                success: '✅',
                error: '❌',
                info: 'ℹ️',
                warning: '⚠️'
            };
            const log = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            log.innerHTML += `<br><span class="${colors[type] || 'debug-info'}">[${time}] ${icons[type] || 'ℹ️'} ${message}</span>`;
            console.log(`[ADMIN_BANNERS_DEBUG] ${message}`);
            const box = document.getElementById('debugBox');
            box.scrollTop = box.scrollHeight;
        }

        window.toggleDebug = function() {
            const box = document.getElementById('debugBox');
            debugVisible = !debugVisible;
            box.classList.toggle('show');
            if (debugVisible) {
                addDebug('Debug mode activated', 'info');
            }
        };

        // ============================================
        // THEME
        // ============================================
        const themeToggle = document.getElementById('themeToggle');
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            localStorage.setItem('darkMode', darkMode);
            themeToggle.querySelector('i').className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
        });

        // ============================================
        // SIDEBAR
        // ============================================
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const sidebarToggle = document.getElementById('sidebarToggle');

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                sidebarOverlay.classList.toggle('open');
            });
        }
        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', () => {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('open');
            });
        }

        // ============================================
        // SIDEBAR NAVIGATION
        // ============================================
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                if (href) window.location.href = href;
            });
        });

        // ============================================
        // LOGOUT
        // ============================================
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await signOut(auth);
                window.location.href = '/';
            } catch (error) {
                showToast('error', 'Gagal logout: ' + error.message);
            }
        });

        // ============================================
        // TOAST
        // ============================================
        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const colors = { success: 'var(--success)', error: 'var(--danger)', warning: 'var(--warning)', info: 'var(--info)' };
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = colors[type] || colors.info;
            toast.innerHTML = `
                <span class="toast-icon"><i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i></span>
                <div class="toast-content"><div class="toast-message">${message}</div></div>
                <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
        }
        window.showToast = showToast;

        // ============================================
        // SHOW ERROR
        // ============================================
        function showError(title, detail) {
            const box = document.getElementById('errorBox');
            document.getElementById('errorTitle').textContent = title || 'Terjadi Kesalahan';
            document.getElementById('errorDetail').textContent = detail || '';
            box.classList.add('show');
            setTimeout(() => { box.classList.remove('show'); }, 10000);
        }

        // ============================================
        // FORMAT FUNCTIONS
        // ============================================
        function formatDate(date) {
            if (!date) return '-';
            const d = date instanceof Date ? date : new Date(date);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('id-ID', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ============================================
        // AUTH STATE
        // ============================================
        addDebug('Setting up auth listener...', 'info');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                addDebug('User not logged in, redirecting...', 'warning');
                window.location.href = '/admin/login';
                return;
            }
            currentUser = user;
            addDebug(`User logged in: ${user.email}`, 'success');

            try {
                const userRef = doc(db, 'users', user.uid);
                const userDoc = await getDoc(userRef);
                if (!userDoc.exists() || userDoc.data().role !== 'admin') {
                    addDebug('User is not admin, redirecting...', 'error');
                    window.location.href = '/';
                    return;
                }
                addDebug('Admin verified', 'success');
                await loadBanners();
                await loadSettings();

                onSnapshot(collection(db, 'banners'), () => {
                    addDebug('Banners collection updated - reloading...', 'info');
                    loadBanners();
                });

            } catch (error) {
                addDebug(`Error: ${error.message}`, 'error');
                showToast('error', 'Gagal memuat data: ' + error.message);
            }
        });

        // ============================================
        // LOAD BANNERS
        // ============================================
        async function loadBanners() {
            addDebug('Loading banners...', 'info');

            try {
                const snapshot = await getDocs(collection(db, 'banners'));
                addDebug(`Fetched ${snapshot.size} banners from Firestore`, 'info');

                const container = document.getElementById('bannersGrid');

                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="text-center text-secondary" style="grid-column:1/-1;padding:40px 0;">
                            <i class="fas fa-images" style="font-size:48px;display:block;margin-bottom:16px;"></i>
                            Belum ada banner
                        </div>
                    `;
                    addDebug('No banners found', 'info');
                    return;
                }

                // Sort di client
                const banners = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data(),
                    createdAtDate: doc.data().createdAt?.toDate?.() || new Date(doc.data().createdAt)
                })).sort((a, b) => b.createdAtDate - a.createdAtDate);

                container.innerHTML = banners.map(b => `
                    <div class="banner-card">
                        <div class="banner-image">
                            ${b.imageUrl ? `<img src="${b.imageUrl}" alt="${b.title}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-image"></i>'}
                        </div>
                        <div class="banner-body">
                            <h4>${b.title || 'Banner'}</h4>
                            <p style="font-size:14px;color:var(--text-secondary);">${b.description || 'Tidak ada deskripsi'}</p>
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                                <span class="badge ${b.isActive ? 'badge-success' : 'badge-danger'}">${b.isActive ? 'Active' : 'Inactive'}</span>
                                <span style="font-size:12px;color:var(--text-light);">Exp: ${formatDate(b.expiresAt)}</span>
                            </div>
                            <div class="banner-actions">
                                <button onclick="toggleBanner('${b.id}')" class="btn btn-secondary btn-sm" style="flex:1;">
                                    <i class="fas ${b.isActive ? 'fa-pause' : 'fa-play'}"></i> ${b.isActive ? 'Nonaktifkan' : 'Aktifkan'}
                                </button>
                                <button onclick="deleteBanner('${b.id}')" class="btn btn-danger btn-sm" style="flex:1;">
                                    <i class="fas fa-trash"></i> Hapus
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');

                addDebug(`Loaded ${banners.length} banners`, 'success');

            } catch (error) {
                addDebug(`Error loading banners: ${error.message}`, 'error');
                console.error('❌ [ADMIN_BANNERS] Error:', error);
                showError('Gagal memuat banner', error.message);
                showToast('error', 'Gagal memuat banner: ' + error.message);
                document.getElementById('bannersGrid').innerHTML = `
                    <div class="text-center" style="grid-column:1/-1;color:var(--danger);padding:40px 0;">
                        Gagal memuat banner: ${error.message}
                    </div>
                `;
            }
        }

        // ============================================
        // LOAD SETTINGS
        // ============================================
        async function loadSettings() {
            try {
                addDebug('Loading banner settings...', 'info');
                const settingsRef = doc(db, 'settings', 'banner');
                const settingsDoc = await getDoc(settingsRef);

                if (settingsDoc.exists()) {
                    const data = settingsDoc.data();
                    document.getElementById('bannerPrice').value = data.price || 100000;
                    document.getElementById('bannerDuration').value = data.duration || 24;
                    document.getElementById('maxBanners').value = data.maxSlots || 5;
                    document.getElementById('autoSlideSpeed').value = data.autoSlideSpeed || 5;
                    addDebug('Banner settings loaded', 'success');
                } else {
                    // Create default settings if not exists
                    addDebug('No settings found, creating default...', 'warning');
                    await setDoc(settingsRef, {
                        price: 100000,
                        duration: 24,
                        maxSlots: 5,
                        autoSlideSpeed: 5,
                        updatedAt: new Date().toISOString()
                    });
                    addDebug('Default settings created', 'success');
                }
            } catch (error) {
                addDebug(`Error loading settings: ${error.message}`, 'error');
                console.error('❌ [ADMIN_BANNERS] Settings error:', error);
            }
        }

        // ============================================
        // TOGGLE BANNER
        // ============================================
        window.toggleBanner = async function(id) {
            addDebug(`Toggling banner: ${id}`, 'info');

            try {
                const bannerRef = doc(db, 'banners', id);
                const bannerDoc = await getDoc(bannerRef);
                if (!bannerDoc.exists()) {
                    addDebug('Banner not found', 'error');
                    showToast('error', 'Banner tidak ditemukan');
                    return;
                }

                const current = bannerDoc.data().isActive;
                await updateDoc(bannerRef, {
                    isActive: !current,
                    updatedAt: new Date().toISOString()
                });

                addDebug(`Banner ${!current ? 'activated' : 'deactivated'}`, 'success');
                showToast('success', `Banner ${!current ? 'diaktifkan' : 'dinonaktifkan'}`);
                await loadBanners();
            } catch (error) {
                addDebug(`Error toggling banner: ${error.message}`, 'error');
                showToast('error', 'Gagal mengubah status banner: ' + error.message);
            }
        };

        // ============================================
        // DELETE BANNER
        // ============================================
        window.deleteBanner = async function(id) {
            addDebug(`Deleting banner: ${id}`, 'warning');

            if (!confirm('Yakin ingin menghapus banner ini?')) return;

            try {
                await deleteDoc(doc(db, 'banners', id));
                addDebug(`Banner ${id} deleted`, 'success');
                showToast('success', 'Banner berhasil dihapus');
                await loadBanners();
            } catch (error) {
                addDebug(`Error deleting banner: ${error.message}`, 'error');
                showToast('error', 'Gagal menghapus banner: ' + error.message);
            }
        };

        // ============================================
        // SETTINGS MODAL
        // ============================================
        window.openBannerSettings = function() {
            addDebug('Opening banner settings modal', 'info');
            document.getElementById('settingsModal').classList.add('open');
        };

        window.closeSettingsModal = function() {
            document.getElementById('settingsModal').classList.remove('open');
        };

        // ============================================
        // SAVE SETTINGS
        // ============================================
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            addDebug('Saving banner settings...', 'info');

            const price = parseInt(document.getElementById('bannerPrice').value);
            const duration = parseInt(document.getElementById('bannerDuration').value);
            const maxSlots = parseInt(document.getElementById('maxBanners').value);
            const autoSlideSpeed = parseInt(document.getElementById('autoSlideSpeed').value);

            if (!price || price < 1000) {
                showToast('warning', 'Harga banner minimal Rp1.000');
                addDebug('Invalid price', 'warning');
                return;
            }
            if (!duration || duration < 1) {
                showToast('warning', 'Durasi minimal 1 jam');
                addDebug('Invalid duration', 'warning');
                return;
            }

            try {
                const settingsRef = doc(db, 'settings', 'banner');
                await updateDoc(settingsRef, {
                    price: price,
                    duration: duration,
                    maxSlots: maxSlots,
                    autoSlideSpeed: autoSlideSpeed,
                    updatedAt: new Date().toISOString()
                });

                addDebug('Settings saved successfully', 'success');
                showToast('success', 'Pengaturan banner berhasil disimpan');
                closeSettingsModal();
            } catch (error) {
                addDebug(`Error saving settings: ${error.message}`, 'error');
                showToast('error', 'Gagal menyimpan pengaturan: ' + error.message);
            }
        });

        addDebug('Page ready', 'success');
        console.log('✅ [ADMIN_BANNERS] Page ready');
    </script>
</body>
</html>
