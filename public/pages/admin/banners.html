<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manajemen Banner - ProductKuu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&family=Archivo+Black&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
:root,[data-theme="light"]{--bg:#F4F1E8;--bg-grid:rgba(0,0,0,.055);--surface:#FFF;--surface-2:#FAF8F0;--ink:#0A0A0A;--ink-muted:#4A4A4A;--ink-soft:#7A7A7A;--lime:#C4F000;--lime-deep:#9BC400;--amber:#FFC400;--amber-deep:#D9A300;--blue:#2B6FFF;--blue-deep:#1E4FCC;--blue-soft:#E6EEFF;--border:#0A0A0A;--border-width:2px;--shadow-color:#0A0A0A;--shadow-x:4px;--shadow-y:4px;--grid-line:rgba(0,0,0,.08);--nav-bg:#F4F1E8}
[data-theme="dark"]{--bg:#0B0B0D;--bg-grid:rgba(255,255,255,.045);--surface:#16161A;--surface-2:#1E1E24;--ink:#F5F3EC;--ink-muted:#B8B8C0;--ink-soft:#8A8A92;--lime:#C4F000;--lime-deep:#A8D400;--amber:#FFC400;--amber-deep:#E0AC00;--blue:#4D8BFF;--blue-deep:#2B6FFF;--blue-soft:#1A2540;--border:#F5F3EC;--border-width:2px;--shadow-color:#F5F3EC;--shadow-x:4px;--shadow-y:4px;--grid-line:rgba(255,255,255,.06);--nav-bg:#0B0B0D}
*{scroll-behavior:smooth;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background-color:var(--bg);color:var(--ink);margin:0;line-height:1.6;overflow-x:hidden;transition:background-color .35s ease,color .35s ease;background-image:linear-gradient(to right,var(--grid-line) 1px,transparent 1px),linear-gradient(to bottom,var(--grid-line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
.font-mono-tag{font-family:'Space Mono',monospace}
.font-display{font-family:'Archivo Black',sans-serif;letter-spacing:-.02em}
.neo-tag{display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:#0A0A0A;font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.9px;padding:6px 14px;border:var(--border-width) solid var(--border);box-shadow:3px 3px 0 var(--shadow-color);font-family:'Space Mono',monospace}
.neo-tag.blue{background:var(--blue);color:#FFF}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.6px;padding:10px 20px;border:var(--border-width) solid var(--border);border-radius:0;cursor:pointer;text-decoration:none;transition:all .09s;white-space:nowrap}
.btn-primary{background:var(--lime);color:#0A0A0A;box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--shadow-color)}
.btn-primary:hover:not(:disabled){transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--shadow-color);background:var(--amber)}
.btn-secondary{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--shadow-color)}
.btn-secondary:hover:not(:disabled){transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--blue);border-color:var(--blue);color:var(--blue)}
.btn-danger{background:#FF4444;color:#FFF;box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--shadow-color)}
.form-input{width:100%;background:var(--bg);border:var(--border-width) solid var(--border);padding:11px 14px;color:var(--ink);font-weight:600;font-size:14px;outline:none}
.form-input:focus{border-color:var(--blue);box-shadow:4px 4px 0 var(--blue)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(2px);z-index:2000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:3px solid var(--border);box-shadow:10px 10px 0 var(--lime);max-width:540px;width:100%;padding:32px;position:relative}
.banner-card{background:var(--surface);border:var(--border-width) solid var(--border);box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--shadow-color);overflow:hidden;transition:all .14s}
.banner-card:hover{transform:translate(-4px,-4px);box-shadow:9px 9px 0 var(--lime);border-color:var(--lime)}
.banner-img{height:180px;background:var(--surface-2);border-bottom:var(--border-width) solid var(--border);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.banner-img img{width:100%;height:100%;object-fit:cover}
.badge{padding:4px 10px;border:1.5px solid var(--border);font-size:10px;font-weight:900;text-transform:uppercase;font-family:'Space Mono',monospace;box-shadow:2px 2px 0 var(--shadow-color);display:inline-block}
.badge-success{background:var(--lime);color:#0A0A0A}
.badge-danger{background:#FF4444;color:#FFF}
</style>
</head>
<body data-theme="light">

<script>
    const token = localStorage.getItem('pk_token');
    const userStr = localStorage.getItem('pk_user');
    if (!token || !userStr) { window.location.replace('/admin/login'); } 
    else { try { const u = JSON.parse(userStr); if (u.role !== 'admin') window.location.replace('/'); } catch(e) { window.location.replace('/admin/login'); } }
</script>

<nav class="fixed top-0 left-0 right-0 z-[1000] h-[76px] bg-[var(--nav-bg)] border-b-[2px] border-[var(--border)]">
<div class="max-w-7xl mx-auto px-4 sm:px-6 h-full flex items-center justify-between gap-3">
    <a class="text-xl sm:text-2xl font-black tracking-tight flex items-center gap-2 shrink-0" href="/admin/dashboard">
        <span class="bg-[var(--lime)] text-[#0A0A0A] px-2.5 py-1 border-2 border-[var(--border)] font-black shadow-[2px_2px_0px_var(--shadow-color)]">Admin</span>
        <span class="text-[var(--ink)] font-black">Panel</span>
    </a>
    <div class="flex items-center gap-2.5">
        <button class="btn btn-secondary !py-2 !px-3.5" id="themeToggle"><span class="material-symbols-outlined text-lg">dark_mode</span></button>
        <button class="lg:hidden btn btn-secondary !py-2 !px-3.5" id="sidebarToggle"><span class="material-symbols-outlined text-lg">menu</span></button>
        <button class="btn btn-danger !py-2 !px-3.5" id="logoutBtn">Logout</button>
    </div>
</div>
</nav>
<div class="fixed inset-0 bg-black/50 z-[800] hidden transition-opacity" id="sidebarOverlay"></div>
<aside class="fixed top-[76px] left-0 bottom-0 w-[260px] bg-[var(--surface)] border-r-[2px] border-[var(--border)] z-[900] flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-300" id="sidebar">
    <div class="p-4 border-b-2 border-[var(--border)] bg-[var(--bg)]"><p class="text-[10px] font-black text-[var(--ink-muted)] uppercase tracking-widest font-mono-tag">Main Menu</p></div>
    <nav class="p-4 flex flex-col gap-2 flex-1 overflow-y-auto">
        <a href="/admin/dashboard" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">dashboard</span> Dashboard</a>
        <a href="/admin/sellers" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">storefront</span> Sellers</a>
        <a href="/admin/products" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">inventory_2</span> Produk</a>
        <a href="/admin/orders" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">shopping_cart</span> Order</a>
        <a href="/admin/banners" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-[var(--border)] bg-[var(--lime)] text-[#0A0A0A] shadow-[3px_3px_0px_var(--shadow-color)]"><span class="material-symbols-outlined">ad_units</span> Banner</a>
        <a href="/admin/withdrawals" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">account_balance_wallet</span> Withdraw</a>
        <a href="/admin/settings" class="flex items-center gap-3 p-3 text-sm font-extrabold uppercase border-2 border-transparent hover:bg-[var(--bg)] hover:border-[var(--border)] transition-all text-[var(--ink)]"><span class="material-symbols-outlined">settings</span> Pengaturan</a>
    </nav>
</aside>

<main class="pt-[100px] pb-10 px-4 lg:ml-[260px] transition-all">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between md:items-end gap-6 mb-10">
            <div>
                <span class="neo-tag amber mb-3">PROMOSI</span>
                <h1 class="font-display text-3xl sm:text-5xl text-[var(--ink)] mt-3">Manajemen Banner</h1>
            </div>
            <div class="flex flex-wrap gap-3 w-full md:w-auto">
                <button class="btn btn-secondary flex-1 md:flex-none" onclick="loadBanners()"><span class="material-symbols-outlined">sync</span> Refresh</button>
                <button class="btn btn-primary flex-1 md:flex-none" onclick="openAddModal()"><span class="material-symbols-outlined">add</span> Tambah Banner</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="bannersGrid">
            <div class="col-span-full text-center py-20 font-bold text-[var(--ink-muted)]">Memuat data...</div>
        </div>
    </div>
</main>

<div class="modal-overlay" id="bannerModal">
<div class="modal">
    <button class="absolute top-4 right-4 font-black text-2xl hover:text-[#FF4444]" onclick="closeAddModal()">×</button>
    <h3 class="font-display text-2xl mb-6">Tambah Banner</h3>
    <form id="bannerForm">
        <div class="space-y-4">
            <div><label class="block text-xs font-black uppercase mb-1">Judul Banner</label><input class="form-input" id="bannerTitle" required/></div>
            <div><label class="block text-xs font-black uppercase mb-1">URL Gambar</label><input class="form-input" id="bannerImage" type="url" required/></div>
            <div><label class="block text-xs font-black uppercase mb-1">Link Tujuan (Opsional)</label><input class="form-input" id="bannerLink" type="text"/></div>
            <div><label class="block text-xs font-black uppercase mb-1">Deskripsi Singkat</label><textarea class="form-input" id="bannerDesc" rows="2"></textarea></div>
            <div class="pt-4 flex gap-3">
                <button class="btn btn-primary flex-1" type="submit">Simpan Banner</button>
                <button class="btn btn-secondary flex-1" type="button" onclick="closeAddModal()">Batal</button>
            </div>
        </div>
    </form>
</div>
</div>

<script>
(function() { const saved = localStorage.getItem('pk-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); })();
document.getElementById('themeToggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); document.body.setAttribute('data-theme', next); localStorage.setItem('pk-theme', next);
    document.getElementById('themeToggle').innerHTML = `<span class="material-symbols-outlined text-lg">${next === 'dark' ? 'light_mode' : 'dark_mode'}</span>`;
});
const sidebar = document.getElementById('sidebar'); const sidebarOverlay = document.getElementById('sidebarOverlay');
document.getElementById('sidebarToggle').addEventListener('click', () => { sidebar.classList.toggle('-translate-x-full'); sidebarOverlay.classList.toggle('hidden'); });
sidebarOverlay.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); });
document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.clear(); window.location.href = '/admin/login'; });

async function loadBanners() {
    const grid = document.getElementById('bannersGrid');
    try {
        const res = await fetch('/api/banners');
        const banners = await res.json();
        
        if (!banners || banners.length === 0) {
            grid.innerHTML = '<div class="col-span-full text-center py-20 font-bold text-[var(--ink-muted)]">Belum ada banner aktif.</div>';
            return;
        }

        grid.innerHTML = banners.map(b => `
            <div class="banner-card">
                <div class="banner-img">
                    ${b.imageUrl ? `<img src="${b.imageUrl}" onerror="this.src='https://placehold.co/600x300/1E1E24/C4F000?text=No+Image'">` : '<span class="material-symbols-outlined text-6xl text-[var(--ink-soft)]">image</span>'}
                </div>
                <div class="p-5">
                    <h3 class="font-black text-lg mb-1 truncate">${b.title || 'Tanpa Judul'}</h3>
                    <p class="text-xs text-[var(--ink-muted)] font-mono-tag mb-4 truncate">${b.linkUrl || 'Tidak ada link'}</p>
                    <div class="flex gap-2">
                        <button class="btn btn-secondary flex-1 !py-2 !px-3 text-xs" onclick="toggleStatus('${b.id}', ${b.active})">
                            <span class="material-symbols-outlined text-sm">${b.active ? 'visibility_off' : 'visibility'}</span>
                            ${b.active ? 'Nonaktifkan' : 'Aktifkan'}
                        </button>
                        <button class="btn btn-danger !p-2" onclick="deleteBanner('${b.id}')"><span class="material-symbols-outlined text-sm">delete</span></button>
                    </div>
                </div>
            </div>
        `).join('');
    } catch (e) {
        grid.innerHTML = `<div class="col-span-full text-center text-red-500 font-bold py-10">Gagal memuat: ${e.message}</div>`;
    }
}

window.toggleStatus = async (id, currentStatus) => {
    try {
        const res = await fetch('/api/banners/' + id);
        const b = await res.json();
        await fetch('/api/banners', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...b, id: id, active: !currentStatus, updatedAt: new Date().toISOString() })
        });
        loadBanners();
    } catch (e) { alert('Gagal ubah status'); }
};

window.deleteBanner = async (id) => {
    if (!confirm('Hapus banner ini?')) return;
    try {
        await fetch('/api/banners/' + id, { method: 'DELETE' });
        loadBanners();
    } catch (e) { alert('Gagal hapus banner'); }
};

window.openAddModal = () => document.getElementById('bannerModal').classList.add('open');
window.closeAddModal = () => document.getElementById('bannerModal').classList.remove('open');

document.getElementById('bannerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true; btn.innerText = 'Menyimpan...';
    
    const payload = {
        id: Date.now().toString(),
        title: document.getElementById('bannerTitle').value.trim(),
        imageUrl: document.getElementById('bannerImage').value.trim(),
        linkUrl: document.getElementById('bannerLink').value.trim(),
        description: document.getElementById('bannerDesc').value.trim(),
        active: true,
        createdAt: new Date().toISOString()
    };

    try {
        await fetch('/api/banners', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        closeAddModal(); loadBanners();
    } catch (error) { alert('Gagal menyimpan: ' + error.message); }
    finally { btn.disabled = false; btn.innerText = 'Simpan Banner'; }
});

document.addEventListener('DOMContentLoaded', loadBanners);
</script>
</body>
</html>
