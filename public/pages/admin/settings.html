<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - ProductKuu Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" href="../../assets/images/favicon.ico">
    <style>
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-logo"><i class="fas fa-cube"></i><span>ProductKuu</span></a>
            <div class="navbar-actions">
                <span class="badge badge-primary hide-mobile" style="font-size: 11px;">Admin</span>
                <button class="btn-icon" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="btn-icon" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <aside class="sidebar" id="sidebar">
        <div style="padding: 0 12px 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px;">
            <div style="font-weight: 600; font-size: 14px; color: var(--text-secondary);">Menu Admin</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/admin/dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="/admin/sellers"><i class="fas fa-users"></i> Seller</a>
            <a href="/admin/products"><i class="fas fa-box"></i> Produk</a>
            <a href="/admin/orders"><i class="fas fa-shopping-cart"></i> Order</a>
            <a href="/admin/banners"><i class="fas fa-images"></i> Banner</a>
            <a href="/admin/withdrawals"><i class="fas fa-arrow-up"></i> Withdraw</a>
            <a href="/admin/settings" class="active"><i class="fas fa-cog"></i> Pengaturan</a>
            <button onclick="handleLogout()" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: none; background: none; width: 100%; border-radius: var(--radius); color: var(--danger); cursor: pointer; font-family: var(--font); font-size: 14px; font-weight: 500; margin-top: 8px;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <div><h1 style="font-size: 24px;">Pengaturan Website</h1><p style="color: var(--text-secondary);">Kelola semua pengaturan website</p></div>
        </div>

        <div class="settings-grid">
            <!-- Website Settings -->
            <div class="card">
                <h4 style="margin-bottom: 16px;">Pengaturan Website</h4>
                <form id="websiteSettingsForm">
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="siteName">Nama Website</label>
                        <input type="text" id="siteName" class="input" placeholder="ProductKuu">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="siteLogo">Logo URL</label>
                        <input type="url" id="siteLogo" class="input" placeholder="https://example.com/logo.png">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="siteFavicon">Favicon URL</label>
                        <input type="url" id="siteFavicon" class="input" placeholder="https://example.com/favicon.ico">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                        <div class="input-group"><label for="primaryColor">Primary Color</label><input type="color" id="primaryColor" class="input" style="height: 48px; padding: 4px;"></div>
                        <div class="input-group"><label for="secondaryColor">Secondary Color</label><input type="color" id="secondaryColor" class="input" style="height: 48px; padding: 4px;"></div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> Simpan Website</button>
                </form>
            </div>

            <!-- Marketplace Settings -->
            <div class="card">
                <h4 style="margin-bottom: 16px;">Pengaturan Marketplace</h4>
                <form id="marketplaceSettingsForm">
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="holdingDays">Holding Balance (Hari)</label>
                        <input type="number" id="holdingDays" class="input" placeholder="7" min="1">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="commission">Komisi Marketplace (%)</label>
                        <input type="number" id="commission" class="input" placeholder="10" min="0" max="100">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="minWithdraw">Minimal Withdraw (Rp)</label>
                        <input type="number" id="minWithdraw" class="input" placeholder="50000" min="1000">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="maxWithdraw">Maksimal Withdraw (Rp)</label>
                        <input type="number" id="maxWithdraw" class="input" placeholder="10000000" min="1000">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="withdrawMethods">Metode Withdraw</label>
                        <input type="text" id="withdrawMethods" class="input" placeholder="DANA, OVO, GoPay, Bank BCA">
                        <span class="hint">Pisahkan dengan koma</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                        <input type="checkbox" id="maintenanceMode"> <label for="maintenanceMode" style="font-size: 14px;">Mode Maintenance</label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> Simpan Marketplace</button>
                </form>
            </div>

            <!-- Social Media Settings -->
            <div class="card">
                <h4 style="margin-bottom: 16px;">Media Sosial</h4>
                <form id="socialSettingsForm">
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="socialWhatsapp">WhatsApp</label>
                        <input type="text" id="socialWhatsapp" class="input" placeholder="08123456789">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="socialEmail">Email</label>
                        <input type="email" id="socialEmail" class="input" placeholder="admin@example.com">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="socialInstagram">Instagram</label>
                        <input type="text" id="socialInstagram" class="input" placeholder="@productkuu">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="socialFacebook">Facebook</label>
                        <input type="text" id="socialFacebook" class="input" placeholder="productkuu">
                    </div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="socialTiktok">TikTok</label>
                        <input type="text" id="socialTiktok" class="input" placeholder="@productkuu">
                    </div>
                    <div class="input-group" style="margin-bottom: 16px;">
                        <label for="socialYoutube">YouTube</label>
                        <input type="text" id="socialYoutube" class="input" placeholder="productkuu">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> Simpan Media Sosial</button>
                </form>
            </div>

            <!-- Footer Settings -->
            <div class="card">
                <h4 style="margin-bottom: 16px;">Pengaturan Footer</h4>
                <form id="footerSettingsForm">
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="footerText">Footer Text</label>
                        <input type="text" id="footerText" class="input" placeholder="&copy; 2026 ProductKuu. All rights reserved.">
                    </div>
                    <div class="input-group" style="margin-bottom: 16px;">
                        <label for="footerLinks">Footer Links (JSON)</label>
                        <textarea id="footerLinks" class="input" rows="4" placeholder='[{"label":"Tentang","url":"/tentang"},{"label":"Kontak","url":"/kontak"}]'></textarea>
                        <span class="hint">Format JSON array</span>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> Simpan Footer</button>
                </form>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { db, auth, collections, doc, getDoc, updateDoc, signOut } from '../../js/firebase-config.js';
        import { showToast, navigate } from '../../js/app.js';

        // Theme
        const themeToggle = document.getElementById('themeToggle');
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            localStorage.setItem('darkMode', darkMode);
            themeToggle.querySelector('i').className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
        });

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        };

        document.addEventListener('DOMContentLoaded', async () => {
            auth.onAuthStateChanged(async (user) => {
                if (!user) { navigate('/seller/login'); return; }
                const userRef = doc(db, collections.users, user.uid);
                const userDoc = await getDoc(userRef);
                if (!userDoc.exists() || userDoc.data().role !== 'admin') { showToast('error', 'Akses ditolak'); navigate('/'); return; }
                await loadAllSettings();
            });
        });

        async function loadAllSettings() {
            try {
                // Website
                const websiteRef = doc(db, collections.settings, 'website');
                const websiteDoc = await getDoc(websiteRef);
                if (websiteDoc.exists()) {
                    const data = websiteDoc.data();
                    document.getElementById('siteName').value = data.siteName || 'ProductKuu';
                    document.getElementById('siteLogo').value = data.logo || '';
                    document.getElementById('siteFavicon').value = data.favicon || '';
                    document.getElementById('primaryColor').value = data.primaryColor || '#4F46E5';
                    document.getElementById('secondaryColor').value = data.secondaryColor || '#7C3AED';
                }

                // Marketplace
                const marketplaceRef = doc(db, collections.settings, 'marketplace');
                const marketplaceDoc = await getDoc(marketplaceRef);
                if (marketplaceDoc.exists()) {
                    const data = marketplaceDoc.data();
                    document.getElementById('holdingDays').value = data.holdingDays || 7;
                    document.getElementById('commission').value = data.commission || 10;
                    document.getElementById('minWithdraw').value = data.minWithdraw || 50000;
                    document.getElementById('maxWithdraw').value = data.maxWithdraw || 10000000;
                    document.getElementById('withdrawMethods').value = (data.withdrawMethods || ['DANA', 'OVO', 'GoPay']).join(', ');
                    document.getElementById('maintenanceMode').checked = data.maintenanceMode || false;
                }

                // Social
                const socialRef = doc(db, collections.settings, 'social');
                const socialDoc = await getDoc(socialRef);
                if (socialDoc.exists()) {
                    const data = socialDoc.data();
                    document.getElementById('socialWhatsapp').value = data.whatsapp || '';
                    document.getElementById('socialEmail').value = data.email || '';
                    document.getElementById('socialInstagram').value = data.instagram || '';
                    document.getElementById('socialFacebook').value = data.facebook || '';
                    document.getElementById('socialTiktok').value = data.tiktok || '';
                    document.getElementById('socialYoutube').value = data.youtube || '';
                }

                // Footer
                const footerRef = doc(db, collections.settings, 'footer');
                const footerDoc = await getDoc(footerRef);
                if (footerDoc.exists()) {
                    const data = footerDoc.data();
                    document.getElementById('footerText').value = data.footerText || '&copy; 2026 ProductKuu. All rights reserved.';
                    document.getElementById('footerLinks').value = JSON.stringify(data.footerLinks || [
                        { label: 'Tentang', url: '/tentang' },
                        { label: 'Kontak', url: '/kontak' },
                        { label: 'Syarat & Ketentuan', url: '/syarat-ketentuan' }
                    ], null, 2);
                }
            } catch (error) { console.error('Error loading settings:', error); showToast('error', 'Gagal memuat pengaturan'); }
        }

        // Website Settings
        document.getElementById('websiteSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await updateDoc(doc(db, collections.settings, 'website'), {
                    siteName: document.getElementById('siteName').value,
                    logo: document.getElementById('siteLogo').value,
                    favicon: document.getElementById('siteFavicon').value,
                    primaryColor: document.getElementById('primaryColor').value,
                    secondaryColor: document.getElementById('secondaryColor').value,
                    updatedAt: new Date()
                });
                showToast('success', 'Pengaturan website disimpan');
            } catch (error) { console.error('Error saving website settings:', error); showToast('error', 'Gagal menyimpan pengaturan'); }
        });

        // Marketplace Settings
        document.getElementById('marketplaceSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const methods = document.getElementById('withdrawMethods').value.split(',').map(m => m.trim()).filter(m => m);
                await updateDoc(doc(db, collections.settings, 'marketplace'), {
                    holdingDays: parseInt(document.getElementById('holdingDays').value),
                    commission: parseInt(document.getElementById('commission').value),
                    minWithdraw: parseInt(document.getElementById('minWithdraw').value),
                    maxWithdraw: parseInt(document.getElementById('maxWithdraw').value),
                    withdrawMethods: methods,
                    maintenanceMode: document.getElementById('maintenanceMode').checked,
                    updatedAt: new Date()
                });
                showToast('success', 'Pengaturan marketplace disimpan');
            } catch (error) { console.error('Error saving marketplace settings:', error); showToast('error', 'Gagal menyimpan pengaturan'); }
        });

        // Social Settings
        document.getElementById('socialSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await updateDoc(doc(db, collections.settings, 'social'), {
                    whatsapp: document.getElementById('socialWhatsapp').value,
                    email: document.getElementById('socialEmail').value,
                    instagram: document.getElementById('socialInstagram').value,
                    facebook: document.getElementById('socialFacebook').value,
                    tiktok: document.getElementById('socialTiktok').value,
                    youtube: document.getElementById('socialYoutube').value,
                    updatedAt: new Date()
                });
                showToast('success', 'Media sosial disimpan');
            } catch (error) { console.error('Error saving social settings:', error); showToast('error', 'Gagal menyimpan pengaturan'); }
        });

        // Footer Settings
        document.getElementById('footerSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const links = JSON.parse(document.getElementById('footerLinks').value);
                await updateDoc(doc(db, collections.settings, 'footer'), {
                    footerText: document.getElementById('footerText').value,
                    footerLinks: links,
                    updatedAt: new Date()
                });
                showToast('success', 'Pengaturan footer disimpan');
            } catch (error) {
                console.error('Error saving footer settings:', error);
                showToast('error', 'Format JSON tidak valid');
            }
        });

        window.handleLogout = async function() { try { await signOut(auth); showToast('success', 'Berhasil logout'); navigate('/'); } catch (error) { showToast('error', 'Gagal logout'); } };
        document.querySelectorAll('.sidebar-nav a').forEach(link => { link.addEventListener('click', function(e) { e.preventDefault(); navigate(this.getAttribute('href')); }); });
    </script>
</body>
</html>
