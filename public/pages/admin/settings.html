<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - ProductKuu Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/assets/images/favicon.ico">
    <style>
        .app-wrapper { display: flex; min-height: calc(100vh - 64px); margin-top: 64px; }
        .sidebar { width: 260px; background: var(--bg-primary); border-right: 1px solid var(--border-color); padding: 20px 0; position: fixed; top: 64px; bottom: 0; overflow-y: auto; z-index: 100; transition: transform 0.3s ease; }
        .sidebar-header { padding: 0 16px 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
        .sidebar-header .title { font-weight: 600; font-size: 14px; color: var(--text-secondary); }
        .sidebar-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }
        .sidebar-nav a, .sidebar-nav button { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius); color: var(--text-secondary); transition: var(--transition); font-size: 14px; font-weight: 500; text-decoration: none; background: none; border: none; width: 100%; cursor: pointer; font-family: var(--font); text-align: left; }
        .sidebar-nav a:hover, .sidebar-nav button:hover { background: var(--bg-secondary); color: var(--text-primary); }
        .sidebar-nav a.active { background: rgba(79,70,229,0.1); color: var(--primary); }
        .sidebar-nav .logout-btn { color: var(--danger); margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 16px; }
        .sidebar-nav .logout-btn:hover { background: rgba(239,68,68,0.1); color: var(--danger); }
        .sidebar-overlay { display: none; position: fixed; top: 64px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; }
        .sidebar-overlay.open { display: block; }
        .main-content { margin-left: 260px; padding: 24px; flex: 1; min-height: calc(100vh - 64px); }
        .mobile-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--text-primary); cursor: pointer; padding: 8px; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); width: 280px; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 16px; } .mobile-toggle { display: block !important; } }
        
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background: var(--bg-primary); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        .input { width: 100%; padding: 12px 16px; border: 2px solid var(--border-color); border-radius: var(--radius); font-family: var(--font); font-size: 14px; transition: all 0.3s; background: var(--bg-primary); color: var(--text-primary); }
        .input:focus { outline: none; border-color: #4F46E5; box-shadow: 0 0 0 4px rgba(79,70,229,0.1); }
        textarea.input { resize: vertical; min-height: 80px; }
        input[type="color"].input { height: 48px; padding: 4px; cursor: pointer; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: none; border-radius: 12px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, #4F46E5, #7C3AED); color: white; box-shadow: 0 4px 14px rgba(79,70,229,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,70,229,0.4); }
        .btn-block { width: 100%; justify-content: center; }
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
        .badge-primary { background: rgba(79,70,229,0.1); color: var(--primary); }
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 12px; max-width: 400px; width: 100%; }
        .toast { padding: 16px 20px; border-radius: var(--radius); background: var(--bg-primary); box-shadow: var(--shadow-lg); border-left: 4px solid var(--primary); animation: slideInRight 0.3s ease; display: flex; align-items: center; gap: 12px; }
        .toast-icon { font-size: 20px; }
        .toast-content { flex: 1; }
        .toast-message { font-size: 13px; color: var(--text-secondary); }
        .toast-close { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 16px; padding: 4px; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .text-secondary { color: var(--text-secondary); }
        @media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-logo"><i class="fas fa-cube"></i><span>ProductKuu</span></a>
            <div class="navbar-actions">
                <span class="badge badge-primary" style="font-size:11px;">Admin</span>
                <button class="btn-icon" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="mobile-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="title">Menu Admin</div></div>
        <nav class="sidebar-nav">
            <a href="/admin/dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="/admin/sellers"><i class="fas fa-users"></i> Seller</a>
            <a href="/admin/products"><i class="fas fa-box"></i> Produk</a>
            <a href="/admin/orders"><i class="fas fa-shopping-cart"></i> Order</a>
            <a href="/admin/banners"><i class="fas fa-images"></i> Banner</a>
            <a href="/admin/withdrawals"><i class="fas fa-arrow-up"></i> Withdraw</a>
            <a href="/admin/settings" class="active"><i class="fas fa-cog"></i> Pengaturan</a>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-wrapper">
        <main class="main-content">
            <div class="flex-between" style="margin-bottom:24px;">
                <div><h1 style="font-size:24px;">Pengaturan Website</h1><p style="color:var(--text-secondary);">Kelola semua pengaturan website</p></div>
            </div>

            <div class="settings-grid">
                <!-- Website Settings -->
                <div class="card">
                    <h4 style="margin-bottom:16px;">Pengaturan Website</h4>
                    <form id="websiteSettingsForm">
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="siteName">Nama Website</label>
                            <input type="text" id="siteName" class="input" placeholder="ProductKuu">
                        </div>
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="siteLogo">Logo URL</label>
                            <input type="url" id="siteLogo" class="input" placeholder="https://example.com/logo.png">
                        </div>
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="siteFavicon">Favicon URL</label>
                            <input type="url" id="siteFavicon" class="input" placeholder="https://example.com/favicon.ico">
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
                            <div class="input-group"><label for="primaryColor">Primary Color</label><input type="color" id="primaryColor" class="input" style="height:48px;padding:4px;"></div>
                            <div class="input-group"><label for="secondaryColor">Secondary Color</label><input type="color" id="secondaryColor" class="input" style="height:48px;padding:4px;"></div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> Simpan Website</button>
                    </form>
                </div>

                <!-- Marketplace Settings -->
                <div class="card">
                    <h4 style="margin-bottom:16px;">Pengaturan Marketplace</h4>
                    <form id="marketplaceSettingsForm">
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="holdingDays">Holding Balance (Hari)</label>
                            <input type="number" id="holdingDays" class="input" placeholder="7" min="1">
                        </div>
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="commission">Komisi Marketplace (%)</label>
                            <input type="number" id="commission" class="input" placeholder="10" min="0" max="100">
                        </div>
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="minWithdraw">Minimal Withdraw (Rp)</label>
                            <input type="number" id="minWithdraw" class="input" placeholder="50000" min="1000">
                        </div>
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="maxWithdraw">Maksimal Withdraw (Rp)</label>
                            <input type="number" id="maxWithdraw" class="input" placeholder="10000000" min="1000">
                        </div>
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="withdrawMethods">Metode Withdraw</label>
                            <input type="text" id="withdrawMethods" class="input" placeholder="DANA, OVO, GoPay, Bank BCA">
                            <span style="font-size:12px;color:var(--text-light);">Pisahkan dengan koma</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
                            <input type="checkbox" id="maintenanceMode"> <label for="maintenanceMode" style="font-size:14px;">Mode Maintenance</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> Simpan Marketplace</button>
                    </form>
                </div>

                <!-- Social Media Settings -->
                <div class="card">
                    <h4 style="margin-bottom:16px;">Media Sosial</h4>
                    <form id="socialSettingsForm">
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="socialWhatsapp">WhatsApp</label>
                            <input type="text" id="socialWhatsapp" class="input" placeholder="08123456789">
                        </div>
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="socialEmail">Email</label>
                            <input type="email" id="socialEmail" class="input" placeholder="admin@example.com">
                        </div>
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="socialInstagram">Instagram</label>
                            <input type="text" id="socialInstagram" class="input" placeholder="@productkuu">
                        </div>
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="socialFacebook">Facebook</label>
                            <input type="text" id="socialFacebook" class="input" placeholder="productkuu">
                        </div>
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="socialTiktok">TikTok</label>
                            <input type="text" id="socialTiktok" class="input" placeholder="@productkuu">
                        </div>
                        <div class="input-group" style="margin-bottom:16px;">
                            <label for="socialYoutube">YouTube</label>
                            <input type="text" id="socialYoutube" class="input" placeholder="productkuu">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> Simpan Media Sosial</button>
                    </form>
                </div>

                <!-- Footer Settings -->
                <div class="card">
                    <h4 style="margin-bottom:16px;">Pengaturan Footer</h4>
                    <form id="footerSettingsForm">
                        <div class="input-group" style="margin-bottom:12px;">
                            <label for="footerText">Footer Text</label>
                            <input type="text" id="footerText" class="input" placeholder="&copy; 2026 ProductKuu. All rights reserved.">
                        </div>
                        <div class="input-group" style="margin-bottom:16px;">
                            <label for="footerLinks">Footer Links (JSON)</label>
                            <textarea id="footerLinks" class="input" rows="4" placeholder='[{"label":"Tentang","url":"/tentang"},{"label":"Kontak","url":"/kontak"}]'></textarea>
                            <span style="font-size:12px;color:var(--text-light);">Format JSON array</span>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> Simpan Footer</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, onAuthStateChanged, signOut } from "firebase/auth";
        import { getFirestore, doc, getDoc, updateDoc } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyA-6Tqd5i20sCMixQccI5p1sOCgQWN88dE",
            authDomain: "productkuu.firebaseapp.com",
            projectId: "productkuu",
            storageBucket: "productkuu.firebasestorage.app",
            messagingSenderId: "6615996108",
            appId: "1:6615996108:web:daa6e17c1275d3061cd469",
            measurementId: "G-78ZPLZMFEJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        // Theme
        const themeToggle = document.getElementById('themeToggle');
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            localStorage.setItem('darkMode', darkMode);
            themeToggle.querySelector('i').className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
        });

        // Sidebar
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        document.getElementById('sidebarToggle').addEventListener('click', () => { 
            sidebar.classList.toggle('open'); 
            sidebarOverlay.classList.toggle('open'); 
        });
        sidebarOverlay.addEventListener('click', () => { 
            sidebar.classList.remove('open'); 
            sidebarOverlay.classList.remove('open'); 
        });

        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                if (href) window.location.href = href;
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try { await signOut(auth); window.location.href = '/'; } 
            catch (error) { showToast('error', 'Gagal logout'); }
        });

        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const colors = { success: 'var(--success)', error: 'var(--danger)', warning: 'var(--warning)', info: 'var(--info)' };
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = colors[type] || colors.info;
            toast.innerHTML = `
                <span class="toast-icon"><i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i></span>
                <div class="toast-content"><div class="toast-message">${message}</div></div>
                <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
        }
        window.showToast = showToast;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '/admin/login'; return; }
            currentUser = user;
            const userRef = doc(db, 'users', user.uid);
            const userDoc = await getDoc(userRef);
            if (!userDoc.exists() || userDoc.data().role !== 'admin') { window.location.href = '/'; return; }
            await loadAllSettings();
        });

        async function loadAllSettings() {
            try {
                // Website
                const websiteRef = doc(db, 'settings', 'website');
                const websiteDoc = await getDoc(websiteRef);
                if (websiteDoc.exists()) {
                    const data = websiteDoc.data();
                    document.getElementById('siteName').value = data.siteName || 'ProductKuu';
                    document.getElementById('siteLogo').value = data.logo || '';
                    document.getElementById('siteFavicon').value = data.favicon || '';
                    document.getElementById('primaryColor').value = data.primaryColor || '#4F46E5';
                    document.getElementById('secondaryColor').value = data.secondaryColor || '#7C3AED';
                }

                // Marketplace
                const marketplaceRef = doc(db, 'settings', 'marketplace');
                const marketplaceDoc = await getDoc(marketplaceRef);
                if (marketplaceDoc.exists()) {
                    const data = marketplaceDoc.data();
                    document.getElementById('holdingDays').value = data.holdingDays || 7;
                    document.getElementById('commission').value = data.commission || 10;
                    document.getElementById('minWithdraw').value = data.minWithdraw || 50000;
                    document.getElementById('maxWithdraw').value = data.maxWithdraw || 10000000;
                    document.getElementById('withdrawMethods').value = (data.withdrawMethods || ['DANA', 'OVO', 'GoPay']).join(', ');
                    document.getElementById('maintenanceMode').checked = data.maintenanceMode || false;
                }

                // Social
                const socialRef = doc(db, 'settings', 'social');
                const socialDoc = await getDoc(socialRef);
                if (socialDoc.exists()) {
                    const data = socialDoc.data();
                    document.getElementById('socialWhatsapp').value = data.whatsapp || '';
                    document.getElementById('socialEmail').value = data.email || '';
                    document.getElementById('socialInstagram').value = data.instagram || '';
                    document.getElementById('socialFacebook').value = data.facebook || '';
                    document.getElementById('socialTiktok').value = data.tiktok || '';
                    document.getElementById('socialYoutube').value = data.youtube || '';
                }

                // Footer
                const footerRef = doc(db, 'settings', 'footer');
                const footerDoc = await getDoc(footerRef);
                if (footerDoc.exists()) {
                    const data = footerDoc.data();
                    document.getElementById('footerText').value = data.footerText || '&copy; 2026 ProductKuu. All rights reserved.';
                    document.getElementById('footerLinks').value = JSON.stringify(data.footerLinks || [
                        { label: 'Tentang', url: '/tentang' },
                        { label: 'Kontak', url: '/kontak' },
                        { label: 'Syarat & Ketentuan', url: '/syarat-ketentuan' }
                    ], null, 2);
                }
            } catch (error) { 
                console.error('Error loading settings:', error); 
                showToast('error', 'Gagal memuat pengaturan'); 
            }
        }

        // Website Settings
        document.getElementById('websiteSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await updateDoc(doc(db, 'settings', 'website'), {
                    siteName: document.getElementById('siteName').value,
                    logo: document.getElementById('siteLogo').value,
                    favicon: document.getElementById('siteFavicon').value,
                    primaryColor: document.getElementById('primaryColor').value,
                    secondaryColor: document.getElementById('secondaryColor').value,
                    updatedAt: new Date().toISOString()
                });
                showToast('success', 'Pengaturan website disimpan');
            } catch (error) { 
                console.error('Error saving website settings:', error); 
                showToast('error', 'Gagal menyimpan pengaturan'); 
            }
        });

        // Marketplace Settings
        document.getElementById('marketplaceSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const methods = document.getElementById('withdrawMethods').value.split(',').map(m => m.trim()).filter(m => m);
                await updateDoc(doc(db, 'settings', 'marketplace'), {
                    holdingDays: parseInt(document.getElementById('holdingDays').value),
                    commission: parseInt(document.getElementById('commission').value),
                    minWithdraw: parseInt(document.getElementById('minWithdraw').value),
                    maxWithdraw: parseInt(document.getElementById('maxWithdraw').value),
                    withdrawMethods: methods,
                    maintenanceMode: document.getElementById('maintenanceMode').checked,
                    updatedAt: new Date().toISOString()
                });
                showToast('success', 'Pengaturan marketplace disimpan');
            } catch (error) { 
                console.error('Error saving marketplace settings:', error); 
                showToast('error', 'Gagal menyimpan pengaturan'); 
            }
        });

        // Social Settings
        document.getElementById('socialSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await updateDoc(doc(db, 'settings', 'social'), {
                    whatsapp: document.getElementById('socialWhatsapp').value,
                    email: document.getElementById('socialEmail').value,
                    instagram: document.getElementById('socialInstagram').value,
                    facebook: document.getElementById('socialFacebook').value,
                    tiktok: document.getElementById('socialTiktok').value,
                    youtube: document.getElementById('socialYoutube').value,
                    updatedAt: new Date().toISOString()
                });
                showToast('success', 'Media sosial disimpan');
            } catch (error) { 
                console.error('Error saving social settings:', error); 
                showToast('error', 'Gagal menyimpan pengaturan'); 
            }
        });

        // Footer Settings
        document.getElementById('footerSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const links = JSON.parse(document.getElementById('footerLinks').value);
                await updateDoc(doc(db, 'settings', 'footer'), {
                    footerText: document.getElementById('footerText').value,
                    footerLinks: links,
                    updatedAt: new Date().toISOString()
                });
                showToast('success', 'Pengaturan footer disimpan');
            } catch (error) {
                console.error('Error saving footer settings:', error);
                showToast('error', 'Format JSON tidak valid');
            }
        });

        console.log('⚙️ Admin Settings page loaded!');
    </script>
</body>
</html>
