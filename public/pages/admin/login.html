<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login - ProductKuu</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&family=Archivo+Black&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
:root,[data-theme="light"]{--bg:#F4F1E8;--bg-grid:rgba(0,0,0,.055);--surface:#FFF;--surface-2:#FAF8F0;--ink:#0A0A0A;--ink-muted:#4A4A4A;--ink-soft:#7A7A7A;--lime:#C4F000;--lime-deep:#9BC400;--amber:#FFC400;--amber-deep:#D9A300;--blue:#2B6FFF;--blue-deep:#1E4FCC;--blue-soft:#E6EEFF;--border:#0A0A0A;--border-width:2px;--shadow-color:#0A0A0A;--shadow-x:4px;--shadow-y:4px;--grid-line:rgba(0,0,0,.08);--nav-bg:#F4F1E8}
[data-theme="dark"]{--bg:#0B0B0D;--bg-grid:rgba(255,255,255,.045);--surface:#16161A;--surface-2:#1E1E24;--ink:#F5F3EC;--ink-muted:#B8B8C0;--ink-soft:#8A8A92;--lime:#C4F000;--lime-deep:#A8D400;--amber:#FFC400;--amber-deep:#E0AC00;--blue:#4D8BFF;--blue-deep:#2B6FFF;--blue-soft:#1A2540;--border:#F5F3EC;--border-width:2px;--shadow-color:#F5F3EC;--shadow-x:4px;--shadow-y:4px;--grid-line:rgba(255,255,255,.06);--nav-bg:#0B0B0D}
*{scroll-behavior:smooth;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:100px}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background-color:var(--bg);color:var(--ink);margin:0;line-height:1.6;overflow-x:hidden;transition:background-color .35s ease,color .35s ease;background-image:linear-gradient(to right,var(--grid-line) 1px,transparent 1px),linear-gradient(to bottom,var(--grid-line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed;display:flex;flex-direction:column;min-height:100vh}
.font-mono-tag{font-family:'Space Mono',monospace,sans-serif}
.font-display{font-family:'Archivo Black','Inter',sans-serif;letter-spacing:-.02em}
.neo-tag{display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:#0A0A0A;font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.9px;padding:6px 14px;border:var(--border-width) solid var(--border);box-shadow:3px 3px 0 var(--shadow-color);font-family:'Space Mono',monospace}
.neo-tag.amber{background:var(--amber)}.neo-tag.blue{background:var(--blue);color:#FFF}
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;height:76px;background:var(--nav-bg);border-bottom:var(--border-width) solid var(--border);transition:transform .25s ease,box-shadow .25s ease,background .35s,border-color .35s}
.nav-scrolled{box-shadow:0 5px 0 var(--lime)}
.theme-toggle{width:42px;height:42px;border:var(--border-width) solid var(--border);background:var(--surface);color:var(--ink);box-shadow:3px 3px 0 var(--shadow-color);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative;overflow:hidden}
.theme-toggle:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--blue);background:var(--blue);color:#FFF;border-color:var(--blue)}
.theme-toggle .icon-sun,.theme-toggle .icon-moon{position:absolute;transition:all .35s;font-size:20px}
[data-theme="dark"] .theme-toggle .icon-sun{transform:translateY(0) rotate(0);opacity:1}
[data-theme="dark"] .theme-toggle .icon-moon{transform:translateY(30px) rotate(90deg);opacity:0}
[data-theme="light"] .theme-toggle .icon-sun{transform:translateY(-30px) rotate(-90deg);opacity:0}
[data-theme="light"] .theme-toggle .icon-moon{transform:translateY(0) rotate(0);opacity:1}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.6px;padding:12px 22px;border:var(--border-width) solid var(--border);border-radius:0;cursor:pointer;text-decoration:none;transition:all .09s;white-space:nowrap}
.btn-primary{background:var(--lime);color:#0A0A0A;box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--shadow-color)}
.btn-primary:hover:not(:disabled){transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--shadow-color);background:var(--amber)}
.btn-primary:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-color)}
.btn-primary:disabled{opacity:0.7;cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--shadow-color)}
.btn-secondary:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--blue);border-color:var(--blue);color:var(--blue)}
.form-label{display:block;font-size:11px;font-weight:900;color:var(--ink);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;font-family:'Space Mono',monospace}
.form-input{width:100%;background:var(--bg);border:var(--border-width) solid var(--border);padding:11px 14px;color:var(--ink);font-weight:600;font-size:14px;outline:none;transition:all .1s}
.form-input:focus{border-color:var(--blue);box-shadow:4px 4px 0 var(--blue)}
.error-message{display:none;background:#FFE5E5;border:var(--border-width) solid #D40000;color:#8A0000;padding:10px 14px;font-size:12px;font-weight:800;box-shadow:3px 3px 0 #D40000;margin-bottom:16px}
.error-message.show{display:block}
.spinner{animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body data-theme="light">

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
<div class="max-w-7xl mx-auto px-4 sm:px-6 h-full flex items-center justify-between gap-3">
    <a class="text-xl sm:text-2xl font-black tracking-tight flex items-center gap-2 shrink-0" href="/">
        <span class="bg-[var(--lime)] text-[#0A0A0A] px-2.5 py-1 border-2 border-[var(--border)] font-black shadow-[2px_2px_0px_var(--shadow-color)]">Product</span>
        <span class="text-[var(--ink)] font-black">Kuu</span>
    </a>
    <div class="flex items-center gap-2.5">
        <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">
            <span class="material-symbols-outlined icon-sun">light_mode</span>
            <span class="material-symbols-outlined icon-moon">dark_mode</span>
        </button>
        <a href="/" class="btn btn-secondary !py-2 !px-3.5 hidden sm:inline-flex"><span class="material-symbols-outlined text-lg">home</span> Beranda</a>
    </div>
</div>
</nav>

<!-- MAIN CONTENT -->
<main class="flex-1 flex items-center justify-center p-4 pt-28 pb-10">
    <div class="bg-[var(--surface)] border-[3px] border-[var(--border)] shadow-[8px_8px_0px_var(--amber)] max-w-md w-full p-6 sm:p-10 relative">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 mb-4">
                <span class="neo-tag blue"><span class="material-symbols-outlined text-sm">shield_person</span>AKSES TERBATAS</span>
            </div>
            <h1 class="font-display text-3xl sm:text-4xl text-[var(--ink)]">Admin Login</h1>
            <p class="text-[var(--ink-muted)] font-bold mt-2 text-sm">Masuk untuk mengelola marketplace</p>
        </div>

        <div class="error-message" id="loginError">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <span id="errorMessage">Email atau password salah</span>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="form-label" for="email">Email Admin</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[var(--ink-muted)]">mail</span>
                    <input class="form-input pl-10" id="email" type="email" placeholder="admin@productkuu.com" required autocomplete="email"/>
                </div>
            </div>
            
            <div>
                <label class="form-label" for="password">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[var(--ink-muted)]">lock</span>
                    <input class="form-input pl-10 pr-10" id="password" type="password" placeholder="••••••••" required autocomplete="current-password"/>
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--ink-muted)] hover:text-[var(--blue)] transition-colors" id="togglePassword" aria-label="Lihat Password">
                        <span class="material-symbols-outlined text-lg">visibility</span>
                    </button>
                </div>
            </div>

            <button class="btn btn-primary w-full !py-3.5 mt-4" id="loginBtn" type="submit">
                <span class="material-symbols-outlined text-lg">login</span> Masuk
            </button>
        </form>

        <div class="mt-8 pt-6 border-t-2 border-dashed border-[var(--ink-soft)] text-center">
            <p class="text-sm font-bold text-[var(--ink-muted)]">
                Belum punya akun admin? <br/>
                <a href="/admin/register" class="text-[var(--blue)] hover:underline hover:text-[var(--amber)] transition-colors">Register di sini</a>
            </p>
        </div>
    </div>
</main>

<script>
// ============================================
// THEME
// ============================================
(function() {
    const saved = localStorage.getItem('pk-theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.setAttribute('data-theme', 'light');
    document.addEventListener('DOMContentLoaded', () => {
        document.body.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') || 'light');
    });
})();

const themeToggle = document.getElementById('themeToggle');
const navbar = document.getElementById('navbar');

function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('pk-theme', theme);
}
themeToggle?.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
});

window.addEventListener('scroll', () => {
    if (window.pageYOffset > 40) navbar.classList.add('nav-scrolled');
    else navbar.classList.remove('nav-scrolled');
});

// Toggle Password Visibility
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('password');
togglePassword.addEventListener('click', () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    togglePassword.innerHTML = `<span class="material-symbols-outlined text-lg">${type === 'password' ? 'visibility' : 'visibility_off'}</span>`;
});

// ============================================
// LOGIN FORM
// ============================================
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');
    const errorMsg = document.getElementById('errorMessage');

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined spinner text-lg">refresh</span> Memproses...';
    errorEl.classList.remove('show');

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Email atau password salah');

        localStorage.setItem('pk_token', data.token);
        localStorage.setItem('pk_user', JSON.stringify(data.user));

        if (data.user.role === 'admin') {
            window.location.href = '/admin/dashboard';
        } else {
            window.location.href = '/seller/dashboard';
        }
    } catch (error) {
        errorMsg.textContent = error.message;
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-lg">login</span> Masuk';
    }
});
</script>
</body>
</html>
