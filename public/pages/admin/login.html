<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login - ProductKuu</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        :root {
            --bg-deep: #0d0d15;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #00dbe9 0%, #7C3AED 100%);
            --ice-blue: #00dbe9;
            --purple: #a855f7;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --font: 'Inter', sans-serif;
            --radius-lg: 24px;
            --danger: #ef4444;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg-deep);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 219, 233, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(124, 58, 237, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .navbar {
            background: rgba(13, 13, 21, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            height: 72px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .navbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .navbar-logo i {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 48px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header .logo-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 219, 233, 0.1);
            color: var(--ice-blue);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(0, 219, 233, 0.2);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }

        .input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }

        .input:focus {
            border-color: var(--ice-blue);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(0, 219, 233, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 20px -5px rgba(0, 219, 233, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(0, 219, 233, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--danger);
            font-size: 14px;
            display: none;
            margin-bottom: 24px;
            align-items: flex-start;
            gap: 12px;
        }

        .login-error.show { display: flex; }

        .error-detail {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            font-family: monospace;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .auth-footer {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--ice-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-footer a:hover {
            color: white;
        }

        .debug-box {
            background: #000;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #89B4FA;
            max-height: 120px;
            overflow-y: auto;
            display: none;
            border: 1px solid var(--glass-border);
        }
        .debug-box.show { display: block; }
        .debug-line { margin-bottom: 4px; line-height: 1.4; }
        .debug-success { color: #A6E3A1; }
        .debug-error { color: #F38BA8; }
        
        .debug-toggle {
            margin-top: 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            text-decoration: underline;
            display: block;
            width: 100%;
            text-align: center;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: calc(100% - 48px);
        }

        .toast {
            background: rgba(13, 13, 21, 0.9);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 480px) {
            .auth-card { padding: 32px 24px; }
            .navbar-inner { padding: 0 20px; }
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
<div class="navbar-inner">
<a class="navbar-logo" href="/"><i class="fas fa-cube"></i><span>ProductKuu</span></a>
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-secondary hover:bg-white/5 transition-colors" id="themeToggle"><i class="fas fa-moon"></i></button>
<a class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-sm font-semibold hover:bg-white/10 transition-all" href="/">
<i class="fas fa-home mr-2"></i>Beranda
                </a>
</div>
</div>
</nav>
<!-- Main Content -->
<main class="auth-container">
<div class="auth-card">
<div class="auth-header">
<span class="logo-icon"><i class="fas fa-shield-alt"></i></span>
<h1>Admin Login</h1>
<div class="mt-2">
<span class="admin-badge"><i class="fas fa-lock text-[10px]"></i> Akses Terbatas</span>
</div>
<p class="mt-4 text-sm text-gray-400">Hanya untuk administrator ProductKuu</p>
</div>
<div class="login-error" id="loginError">
<i class="fas fa-exclamation-circle mt-1"></i>
<div>
<span id="errorMessage">Email atau password salah</span>
<div class="error-detail" id="errorDetail"></div>
</div>
</div>
<form id="loginForm">
<div class="input-group">
<label for="email">Email Admin</label>
<div class="input-wrapper">
<i class="fas fa-envelope"></i>
<input autocomplete="email" class="input" id="email" placeholder="admin@productkuu.com" required="" type="email" value="admin@productkuu.com"/>
</div>
</div>
<div class="input-group">
<label for="password">Password</label>
<div class="input-wrapper">
<i class="fas fa-lock"></i>
<input autocomplete="current-password" class="input" id="password" placeholder="Masukkan password" required="" type="password"/>
</div>
</div>
<button class="btn-primary" id="loginBtn" type="submit">
<i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin
                </button>
</form>
<!-- Debug Box -->
<div class="debug-box" id="debugBox">
<div class="debug-line" style="color: #89B4FA">🔍 System Monitoring Active</div>
<div id="debugLog">Menunggu login...</div>
</div>
<button class="debug-toggle" onclick="toggleDebug()">
<i class="fas fa-bug mr-1"></i> Toggle Debug Console
            </button>
<div class="auth-divider">atau</div>
<div class="auth-footer">
    Belum punya akun admin? <a href="/admin/register">Register di sini</a>
    <span class="mx-3 text-white/10">•</span>
    <a href="/">Kembali ke Beranda</a>
</div>
</div>
</main>
<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>
<script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"
            }
        }
    </script>
<script type="module">
        // ============================================
        // IMPORTS
        // ============================================
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
        import { getFirestore, doc, getDoc, setDoc } from "firebase/firestore";

        console.log('🔐 [ADMIN_LOGIN] Page loaded');

        // ============================================
        // FIREBASE CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA-6Tqd5i20sCMixQccI5p1sOCgQWN88dE",
            authDomain: "productkuu.firebaseapp.com",
            projectId: "productkuu",
            storageBucket: "productkuu.firebasestorage.app",
            messagingSenderId: "6615996108",
            appId: "1:6615996108:web:daa6e17c1275d3061cd469",
            measurementId: "G-78ZPLZMFEJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log('✅ [ADMIN_LOGIN] Firebase initialized');

        // ============================================
        // DEBUG LOG
        // ============================================
        let debugVisible = false;

        function addDebug(message, type = 'info') {
            const colors = {
                success: 'debug-success',
                error: 'debug-error',
                info: 'text-blue-400',
                warning: 'text-yellow-400'
            };
            const icons = {
                success: '✅',
                error: '❌',
                info: 'ℹ️',
                warning: '⚠️'
            };
            const log = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            log.innerHTML += `<div class="debug-line"><span class="opacity-40 mr-2">${time}</span><span class="${colors[type] || 'text-blue-400'}">${icons[type] || 'ℹ️'} ${message}</span></div>`;
            const box = document.getElementById('debugBox');
            box.scrollTop = box.scrollHeight;
            console.log(`[ADMIN_DEBUG] ${message}`);
        }

        window.toggleDebug = function() {
            const box = document.getElementById('debugBox');
            debugVisible = !debugVisible;
            box.classList.toggle('show');
        };

        // ============================================
        // THEME (Locked to Dark for Redesign)
        // ============================================
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            showToast('info', 'Tema dikunci ke Premium Dark untuk dashboard admin.');
        });

        // ============================================
        // TOAST
        // ============================================
        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#00dbe9' };
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeft = `4px solid ${colors[type] || colors.info}`;
            toast.innerHTML = `
                <div class="w-2 h-2 rounded-full" style="background:${colors[type] || colors.info}"></div>
                <div class="flex-1 text-sm font-medium">${message}</div>
                <button onclick="this.parentElement.remove()" class="text-gray-500 hover:text-white"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 5000);
        }
        window.showToast = showToast;

        // ============================================
        // CHECK LOGIN STATUS
        // ============================================
        addDebug('Setting up auth listener...', 'info');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                addDebug(`User detected: ${user.email}`, 'info');
                try {
                    const userRef = doc(db, 'users', user.uid);
                    const userDoc = await getDoc(userRef);
                    if (userDoc.exists()) {
                        const role = userDoc.data().role;
                        addDebug(`User role: ${role}`, 'success');
                        if (role === 'admin') {
                            addDebug('Redirecting to admin dashboard...', 'success');
                            window.location.href = '../dashboard.html';
                        } else if (role === 'seller') {
                            addDebug('Redirecting to seller dashboard...', 'success');
                            window.location.href = '/admin/dashboard';
                        } else {
                            addDebug(`Unknown role: ${role}`, 'warning');
                        }
                    } else {
                        addDebug('User document NOT FOUND in Firestore!', 'error');
                        addDebug('Creating user document as seller...', 'warning');
                        // Auto create user document if missing (as seller)
                        try {
                            await setDoc(userRef, {
                                uid: user.uid,
                                email: user.email,
                                displayName: user.displayName || 'User',
                                role: 'seller',
                                status: 'active',
                                storeName: user.displayName || 'Toko Saya',
                                wallet: { available: 0, holding: 0, totalRevenue: 0, totalWithdraw: 0 },
                                createdAt: new Date().toISOString(),
                                updatedAt: new Date().toISOString()
                            });
                            addDebug('User document created as seller!', 'success');
                            showToast('success', 'Akun berhasil dibuat! Mengarahkan ke dashboard...');
                            setTimeout(() => { window.location.href = '/seller/dashboard'; }, 1500);
                        } catch (err) {
                            addDebug(`Failed to create user: ${err.message}`, 'error');
                        }
                    }
                } catch (error) {
                    addDebug(`Error checking user: ${error.message}`, 'error');
                }
            } else {
                addDebug('No user logged in', 'info');
            }
        });

        // ============================================
        // LOGIN FORM
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            addDebug('Login form submitted', 'info');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            const errorMsg = document.getElementById('errorMessage');
            const errorDetail = document.getElementById('errorDetail');

            errorEl.classList.remove('show');
            errorDetail.textContent = '';

            if (!email || !password) {
                showToast('warning', 'Email dan password wajib diisi');
                addDebug('Email or password empty', 'warning');
                return;
            }

            addDebug(`Email: ${email}`, 'info');

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';

            try {
                addDebug('Attempting sign in...', 'info');
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                addDebug(`Login success: ${user.email}`, 'success');

                // Get user role
                const userRef = doc(db, 'users', user.uid);
                const userDoc = await getDoc(userRef);

                if (!userDoc.exists()) {
                    addDebug('User document missing, creating as seller...', 'warning');
                    await setDoc(userRef, {
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || email.split('@')[0],
                        role: 'seller',
                        status: 'active',
                        storeName: email.split('@')[0] + "'s Store",
                        wallet: { available: 0, holding: 0, totalRevenue: 0, totalWithdraw: 0 },
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });
                    addDebug('User document created as seller!', 'success');
                    showToast('success', 'Akun berhasil dibuat!');
                    setTimeout(() => { window.location.href = '/admin/dashboard'; }, 1500);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin';
                    return;
                }

                const userData = userDoc.data();
                addDebug(`User role: ${userData.role}`, 'success');

                if (userData.role === 'admin') {
                    showToast('success', 'Selamat datang, Admin ' + (userData.displayName || '') + '!');
                    addDebug('Redirecting to admin dashboard...', 'success');
                    setTimeout(() => { window.location.href = '/admin/dashboard'; }, 500);
                } else if (userData.role === 'seller') {
                    showToast('info', 'Anda login sebagai seller. Diarahkan ke dashboard seller.');
                    addDebug('Redirecting to seller dashboard...', 'success');
                    setTimeout(() => { window.location.href = '/admin/dashboard'; }, 500);
                } else {
                    addDebug(`Invalid role: ${userData.role}`, 'error');
                    await signOut(auth);
                    errorMsg.textContent = 'Akun Anda tidak memiliki akses admin.';
                    errorDetail.textContent = `Role: ${userData.role}`;
                    errorEl.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin';
                }

            } catch (error) {
                console.error('❌ [ADMIN_LOGIN] Error:', error);
                addDebug(`Login error: ${error.code} - ${error.message}`, 'error');

                let message = 'Email atau password salah.';
                let detail = `Error code: ${error.code}`;

                if (error.code === 'auth/user-not-found') {
                    message = 'Email tidak terdaftar. Silakan daftar terlebih dahulu.';
                    detail = 'User not found in Firebase Auth';
                } else if (error.code === 'auth/wrong-password') {
                    message = 'Password salah. Silakan coba lagi.';
                    detail = 'Wrong password';
                } else if (error.code === 'auth/too-many-requests') {
                    message = 'Terlalu banyak percobaan. Coba lagi nanti.';
                    detail = 'Too many failed attempts';
                } else if (error.code === 'auth/invalid-email') {
                    message = 'Format email tidak valid.';
                    detail = 'Invalid email format';
                } else if (error.code === 'auth/user-disabled') {
                    message = 'Akun dinonaktifkan. Hubungi support.';
                    detail = 'User disabled';
                } else if (error.code === 'auth/network-request-failed') {
                    message = 'Koneksi internet bermasalah. Periksa koneksi Anda.';
                    detail = 'Network error';
                }

                errorMsg.textContent = message;
                errorDetail.textContent = detail;
                errorEl.classList.add('show');
                showToast('error', message);

                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin';
            }
        });

        // ============================================
        // KEYBOARD SUPPORT
        // ============================================
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        addDebug('Page ready', 'success');
        console.log('✅ [ADMIN_LOGIN] Page ready');
    </script>
</body></html>
