<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ProductKuu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" href="../../assets/images/favicon.ico">
    <style>
        .auth-container {
            max-width: 440px;
            margin: 80px auto 40px;
            padding: 0 20px;
        }
        .auth-card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 40px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
        }
        .auth-card .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-card .auth-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .auth-card .auth-header p {
            color: var(--text-secondary);
            font-size: 15px;
        }
        .auth-card .auth-header .logo {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 12px;
            display: block;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: var(--text-light);
            font-size: 13px;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
        }
        .input-group .input-icon {
            position: relative;
        }
        .input-group .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }
        .input-group .input-icon .input {
            padding-left: 44px;
        }
        .input-group .input-icon .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
        }
        .input-group .input-icon .toggle-password:hover {
            color: var(--text-primary);
        }
        .login-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius);
            padding: 12px 16px;
            color: var(--danger);
            font-size: 14px;
            display: none;
            margin-bottom: 16px;
        }
        .login-error.show {
            display: block;
        }
        .admin-badge {
            display: inline-block;
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }
        @media (max-width: 480px) {
            .auth-card { padding: 24px; }
            .auth-container { margin-top: 40px; }
        }
    </style>
</head>
<body>
    <!-- Minimal Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-logo">
                <i class="fas fa-cube"></i>
                <span>ProductKuu</span>
            </a>
            <div class="navbar-actions">
                <button class="btn-icon" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="/" class="btn btn-secondary btn-sm">
                    <i class="fas fa-home"></i> Beranda
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <span class="logo"><i class="fas fa-shield-alt"></i></span>
                    <h1>Admin Login</h1>
                    <p>
                        <span class="admin-badge"><i class="fas fa-lock"></i> Akses Terbatas</span>
                    </p>
                    <p style="margin-top: 8px; font-size: 14px; color: var(--text-light);">
                        Hanya untuk administrator ProductKuu
                    </p>
                </div>

                <div class="login-error" id="loginError">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorMessage">Email atau password salah</span>
                </div>

                <form id="loginForm">
                    <!-- Email -->
                    <div class="input-group" style="margin-bottom: 16px;">
                        <label for="email">Email Admin</label>
                        <div class="input-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" class="input" required placeholder="admin@productkuu.com" autocomplete="email">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="input-group" style="margin-bottom: 8px;">
                        <label for="password">Password</label>
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" class="input" required placeholder="Masukkan password" autocomplete="current-password">
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn" style="margin-top: 20px;">
                        <i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin
                    </button>
                </form>

                <div class="auth-divider">atau</div>

                <div class="auth-footer">
                    <a href="/seller/login">Login sebagai Seller</a>
                    <span style="color: var(--text-light); margin: 0 8px;">•</span>
                    <a href="/">Kembali ke Beranda</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="margin-top: 48px;">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 ProductKuu. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { 
            db, auth, collections,
            doc, getDoc,
            signInWithEmailAndPassword, onAuthStateChanged, signOut
        } from '../../js/firebase-config.js';
        import { showToast, navigate } from '../../js/app.js';

        // ============================================
        // CHECK IF ALREADY LOGGED IN
        // ============================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userRef = doc(db, collections.users, user.uid);
                    const userDoc = await getDoc(userRef);
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        if (data.role === 'admin') {
                            navigate('/admin/dashboard');
                            return;
                        } else if (data.role === 'seller') {
                            navigate('/seller/dashboard');
                            return;
                        }
                    }
                } catch (error) {
                    console.error('Error checking user role:', error);
                }
            }
        });

        // ============================================
        // THEME TOGGLE
        // ============================================
        const themeToggle = document.getElementById('themeToggle');
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            localStorage.setItem('darkMode', darkMode);
            themeToggle.querySelector('i').className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
        });

        // ============================================
        // TOGGLE PASSWORD VISIBILITY
        // ============================================
        window.togglePassword = function() {
            const input = document.getElementById('password');
            const icon = input.parentElement.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        };

        // ============================================
        // LOGIN FORM SUBMIT
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            const errorMsg = document.getElementById('errorMessage');

            errorEl.classList.remove('show');

            if (!email) { showToast('warning', 'Email wajib diisi'); return; }
            if (!password) { showToast('warning', 'Password wajib diisi'); return; }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userRef = doc(db, collections.users, user.uid);
                const userDoc = await getDoc(userRef);

                if (!userDoc.exists()) {
                    await signOut(auth);
                    errorMsg.textContent = 'Akun tidak ditemukan.';
                    errorEl.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin';
                    return;
                }

                const userData = userDoc.data();

                if (userData.role === 'admin') {
                    showToast('success', 'Selamat datang, Admin ' + (userData.displayName || '') + '!');
                    navigate('/admin/dashboard');
                } else if (userData.role === 'seller') {
                    showToast('info', 'Anda login sebagai seller. Diarahkan ke dashboard seller.');
                    navigate('/seller/dashboard');
                } else {
                    await signOut(auth);
                    errorMsg.textContent = 'Akun Anda tidak memiliki akses admin.';
                    errorEl.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin';
                }

            } catch (error) {
                console.error('Login error:', error);
                
                let message = 'Email atau password salah.';
                if (error.code === 'auth/user-not-found') {
                    message = 'Email tidak terdaftar.';
                } else if (error.code === 'auth/wrong-password') {
                    message = 'Password salah.';
                } else if (error.code === 'auth/too-many-requests') {
                    message = 'Terlalu banyak percobaan. Coba lagi nanti.';
                }

                errorMsg.textContent = message;
                errorEl.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin';
            }
        });

        // ============================================
        // ENTER KEY SUPPORT
        // ============================================
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        console.log('🔐 Admin Login page loaded successfully!');
    </script>
</body>
</html>
