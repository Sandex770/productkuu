<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ProductKuu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/assets/images/favicon.ico">
    <style>
        .auth-container { max-width: 440px; margin: 80px auto 40px; padding: 0 20px; }
        .auth-card { background: var(--bg-primary); border-radius: var(--radius-lg); padding: 40px; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg); }
        .auth-card .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-card .auth-header h1 { font-size: 28px; margin-bottom: 8px; }
        .auth-card .auth-header p { color: var(--text-secondary); font-size: 15px; }
        .auth-card .auth-header .logo { font-size: 48px; color: var(--primary); margin-bottom: 12px; display: block; }
        .auth-card .auth-header .admin-badge { display: inline-block; background: rgba(79,70,229,0.1); color: var(--primary); padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .input-group label { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        .input { width: 100%; padding: 12px 16px; border: 2px solid var(--border-color); border-radius: var(--radius); font-family: var(--font); font-size: 14px; transition: all 0.3s; background: var(--bg-primary); color: var(--text-primary); }
        .input:focus { outline: none; border-color: #4F46E5; box-shadow: 0 0 0 4px rgba(79,70,229,0.1); }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: none; border-radius: 12px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, #4F46E5, #7C3AED); color: white; box-shadow: 0 4px 14px rgba(79,70,229,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,70,229,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-block { width: 100%; justify-content: center; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-color); transform: translateY(-2px); }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-secondary); }
        .auth-footer a { color: var(--primary); font-weight: 600; }
        .auth-divider { display: flex; align-items: center; gap: 16px; margin: 20px 0; color: var(--text-light); font-size: 13px; }
        .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
        .login-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius); padding: 12px 16px; color: var(--danger); font-size: 14px; display: none; margin-bottom: 16px; }
        .login-error.show { display: block; }
        .login-error .error-detail { font-size: 12px; color: var(--text-light); margin-top: 4px; }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .input-icon .input { padding-left: 44px; }
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 12px; max-width: 400px; width: 100%; }
        .toast { padding: 16px 20px; border-radius: var(--radius); background: var(--bg-primary); box-shadow: var(--shadow-lg); border-left: 4px solid var(--primary); animation: slideInRight 0.3s ease; display: flex; align-items: center; gap: 12px; }
        .toast-icon { font-size: 20px; }
        .toast-content { flex: 1; }
        .toast-message { font-size: 13px; color: var(--text-secondary); }
        .toast-close { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 16px; padding: 4px; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @media (max-width: 480px) { .auth-card { padding: 24px; } }
        
        /* Debug box */
        .debug-box {
            background: #1E1E2E;
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-top: 16px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #CDD6F4;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            border: 1px solid #313244;
        }
        .debug-box.show { display: block; }
        .debug-box .debug-line { padding: 2px 0; border-bottom: 1px solid #2A2A3E; }
        .debug-box .debug-line:last-child { border-bottom: none; }
        .debug-box .debug-success { color: #A6E3A1; }
        .debug-box .debug-error { color: #F38BA8; }
        .debug-box .debug-info { color: #89B4FA; }
        .debug-box .debug-warning { color: #F9E2AF; }
        
        .debug-toggle { margin-top:8px; background:none; border:none; color:var(--text-light); cursor:pointer; font-size:12px; text-decoration:underline; }
        .debug-toggle:hover { color:var(--text-primary); }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-logo"><i class="fas fa-cube"></i><span>ProductKuu</span></a>
            <div class="navbar-actions">
                <button class="btn-icon" id="themeToggle"><i class="fas fa-moon"></i></button>
                <a href="/" class="btn btn-secondary btn-sm"><i class="fas fa-home"></i> Beranda</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <span class="logo"><i class="fas fa-shield-alt"></i></span>
                    <h1>Admin Login</h1>
                    <p>
                        <span class="admin-badge"><i class="fas fa-lock"></i> Akses Terbatas</span>
                    </p>
                    <p style="margin-top:8px;font-size:14px;color:var(--text-light);">Hanya untuk administrator ProductKuu</p>
                </div>

                <div class="login-error" id="loginError">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorMessage">Email atau password salah</span>
                    <div class="error-detail" id="errorDetail"></div>
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="email">Email Admin</label>
                        <div class="input-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" class="input" required placeholder="admin@productkuu.com" autocomplete="email" value="admin@productkuu.com">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" class="input" required placeholder="Masukkan password" autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin
                    </button>
                </form>

                <!-- Debug Box -->
                <div class="debug-box" id="debugBox">
                    <div class="debug-line debug-info">🔍 Debug Mode Active</div>
                    <div class="debug-line" id="debugLog">Menunggu login...</div>
                </div>
                <button class="debug-toggle" onclick="toggleDebug()">
                    <i class="fas fa-bug"></i> Toggle Debug
                </button>

                <div class="auth-divider">atau</div>
                <div class="auth-footer">
                    <a href="/seller/login">Login sebagai Seller</a>
                    <span style="color:var(--text-light);margin:0 8px;">•</span>
                    <a href="/">Kembali ke Beranda</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        // ============================================
        // IMPORTS
        // ============================================
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
        import { getFirestore, doc, getDoc, setDoc } from "firebase/firestore";

        console.log('🔐 [ADMIN_LOGIN] Page loaded');

        // ============================================
        // FIREBASE CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA-6Tqd5i20sCMixQccI5p1sOCgQWN88dE",
            authDomain: "productkuu.firebaseapp.com",
            projectId: "productkuu",
            storageBucket: "productkuu.firebasestorage.app",
            messagingSenderId: "6615996108",
            appId: "1:6615996108:web:daa6e17c1275d3061cd469",
            measurementId: "G-78ZPLZMFEJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log('✅ [ADMIN_LOGIN] Firebase initialized');

        // ============================================
        // DEBUG LOG
        // ============================================
        let debugVisible = false;

        function addDebug(message, type = 'info') {
            const colors = {
                success: 'debug-success',
                error: 'debug-error',
                info: 'debug-info',
                warning: 'debug-warning'
            };
            const icons = {
                success: '✅',
                error: '❌',
                info: 'ℹ️',
                warning: '⚠️'
            };
            const log = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            log.innerHTML += `<br><span class="${colors[type] || 'debug-info'}">[${time}] ${icons[type] || 'ℹ️'} ${message}</span>`;
            console.log(`[ADMIN_DEBUG] ${message}`);
        }

        window.toggleDebug = function() {
            const box = document.getElementById('debugBox');
            debugVisible = !debugVisible;
            box.classList.toggle('show');
        };

        // ============================================
        // THEME
        // ============================================
        const themeToggle = document.getElementById('themeToggle');
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            localStorage.setItem('darkMode', darkMode);
            themeToggle.querySelector('i').className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
        });

        // ============================================
        // TOAST
        // ============================================
        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const colors = { success: 'var(--success)', error: 'var(--danger)', warning: 'var(--warning)', info: 'var(--info)' };
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = colors[type] || colors.info;
            toast.innerHTML = `
                <span class="toast-icon"><i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i></span>
                <div class="toast-content"><div class="toast-message">${message}</div></div>
                <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 5000);
        }
        window.showToast = showToast;

        // ============================================
        // CHECK LOGIN STATUS
        // ============================================
        addDebug('Setting up auth listener...', 'info');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                addDebug(`User detected: ${user.email}`, 'info');
                try {
                    const userRef = doc(db, 'users', user.uid);
                    const userDoc = await getDoc(userRef);
                    if (userDoc.exists()) {
                        const role = userDoc.data().role;
                        addDebug(`User role: ${role}`, 'success');
                        if (role === 'admin') {
                            addDebug('Redirecting to admin dashboard...', 'success');
                            window.location.href = '/admin/dashboard';
                        } else if (role === 'seller') {
                            addDebug('Redirecting to seller dashboard...', 'success');
                            window.location.href = '/seller/dashboard';
                        } else {
                            addDebug(`Unknown role: ${role}`, 'warning');
                        }
                    } else {
                        addDebug('User document NOT FOUND in Firestore!', 'error');
                        addDebug('Creating user document as seller...', 'warning');
                        // Auto create user document if missing (as seller)
                        try {
                            await setDoc(userRef, {
                                uid: user.uid,
                                email: user.email,
                                displayName: user.displayName || 'User',
                                role: 'seller',
                                status: 'active',
                                storeName: user.displayName || 'Toko Saya',
                                wallet: { available: 0, holding: 0, totalRevenue: 0, totalWithdraw: 0 },
                                createdAt: new Date().toISOString(),
                                updatedAt: new Date().toISOString()
                            });
                            addDebug('User document created as seller!', 'success');
                            showToast('success', 'Akun berhasil dibuat! Mengarahkan ke dashboard...');
                            setTimeout(() => { window.location.href = '/seller/dashboard'; }, 1500);
                        } catch (err) {
                            addDebug(`Failed to create user: ${err.message}`, 'error');
                        }
                    }
                } catch (error) {
                    addDebug(`Error checking user: ${error.message}`, 'error');
                }
            } else {
                addDebug('No user logged in', 'info');
            }
        });

        // ============================================
        // LOGIN FORM
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            addDebug('Login form submitted', 'info');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            const errorMsg = document.getElementById('errorMessage');
            const errorDetail = document.getElementById('errorDetail');

            errorEl.classList.remove('show');
            errorDetail.textContent = '';

            if (!email || !password) {
                showToast('warning', 'Email dan password wajib diisi');
                addDebug('Email or password empty', 'warning');
                return;
            }

            addDebug(`Email: ${email}`, 'info');

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';

            try {
                addDebug('Attempting sign in...', 'info');
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                addDebug(`Login success: ${user.email}`, 'success');

                // Get user role
                const userRef = doc(db, 'users', user.uid);
                const userDoc = await getDoc(userRef);

                if (!userDoc.exists()) {
                    addDebug('User document missing, creating as seller...', 'warning');
                    await setDoc(userRef, {
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || email.split('@')[0],
                        role: 'seller',
                        status: 'active',
                        storeName: email.split('@')[0] + "'s Store",
                        wallet: { available: 0, holding: 0, totalRevenue: 0, totalWithdraw: 0 },
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });
                    addDebug('User document created as seller!', 'success');
                    showToast('success', 'Akun berhasil dibuat!');
                    setTimeout(() => { window.location.href = '/seller/dashboard'; }, 1500);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin';
                    return;
                }

                const userData = userDoc.data();
                addDebug(`User role: ${userData.role}`, 'success');

                if (userData.role === 'admin') {
                    showToast('success', 'Selamat datang, Admin ' + (userData.displayName || '') + '!');
                    addDebug('Redirecting to admin dashboard...', 'success');
                    setTimeout(() => { window.location.href = '/admin/dashboard'; }, 500);
                } else if (userData.role === 'seller') {
                    showToast('info', 'Anda login sebagai seller. Diarahkan ke dashboard seller.');
                    addDebug('Redirecting to seller dashboard...', 'success');
                    setTimeout(() => { window.location.href = '/seller/dashboard'; }, 500);
                } else {
                    addDebug(`Invalid role: ${userData.role}`, 'error');
                    await signOut(auth);
                    errorMsg.textContent = 'Akun Anda tidak memiliki akses admin.';
                    errorDetail.textContent = `Role: ${userData.role}`;
                    errorEl.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin';
                }

            } catch (error) {
                console.error('❌ [ADMIN_LOGIN] Error:', error);
                addDebug(`Login error: ${error.code} - ${error.message}`, 'error');

                let message = 'Email atau password salah.';
                let detail = `Error code: ${error.code}`;

                if (error.code === 'auth/user-not-found') {
                    message = 'Email tidak terdaftar. Silakan daftar terlebih dahulu.';
                    detail = 'User not found in Firebase Auth';
                } else if (error.code === 'auth/wrong-password') {
                    message = 'Password salah. Silakan coba lagi.';
                    detail = 'Wrong password';
                } else if (error.code === 'auth/too-many-requests') {
                    message = 'Terlalu banyak percobaan. Coba lagi nanti.';
                    detail = 'Too many failed attempts';
                } else if (error.code === 'auth/invalid-email') {
                    message = 'Format email tidak valid.';
                    detail = 'Invalid email format';
                } else if (error.code === 'auth/user-disabled') {
                    message = 'Akun dinonaktifkan. Hubungi support.';
                    detail = 'User disabled';
                } else if (error.code === 'auth/network-request-failed') {
                    message = 'Koneksi internet bermasalah. Periksa koneksi Anda.';
                    detail = 'Network error';
                }

                errorMsg.textContent = message;
                errorDetail.textContent = detail;
                errorEl.classList.add('show');
                showToast('error', message);

                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk sebagai Admin';
            }
        });

        // ============================================
        // KEYBOARD SUPPORT
        // ============================================
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        addDebug('Page ready', 'success');
        console.log('✅ [ADMIN_LOGIN] Page ready');
    </script>
</body>
</html>
