<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Admin - ProductKuu</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d0d15;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #00dbe9 0%, #7C3AED 100%);
            --ice-blue: #00dbe9;
            --purple: #a855f7;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --font: 'Inter', sans-serif;
            --radius-lg: 24px;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background-color: var(--bg-deep);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 219, 233, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(124, 58, 237, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .navbar {
            background: rgba(13, 13, 21, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            height: 72px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .navbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .navbar-logo i {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 48px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header .logo-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .auth-header .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 219, 233, 0.1);
            color: var(--ice-blue);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(0, 219, 233, 0.2);
            margin-top: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-group .hint {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }

        .input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
            font-family: var(--font);
        }

        .input:focus {
            border-color: var(--ice-blue);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(0, 219, 233, 0.1);
        }

        .input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 20px -5px rgba(0, 219, 233, 0.3);
            font-family: var(--font);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(0, 219, 233, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: var(--font);
            text-decoration: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .auth-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--danger);
            font-size: 14px;
            display: none;
            margin-bottom: 24px;
            align-items: flex-start;
            gap: 12px;
        }

        .auth-error.show { display: flex; }

        .auth-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--success);
            font-size: 14px;
            display: none;
            margin-bottom: 24px;
            align-items: flex-start;
            gap: 12px;
            text-align: center;
            flex-direction: column;
        }

        .auth-success.show { display: flex; }

        .auth-success i {
            font-size: 32px;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .auth-footer {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 24px;
        }

        .auth-footer a {
            color: var(--ice-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-footer a:hover {
            color: white;
        }

        /* Password Strength */
        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .password-strength .bar {
            height: 100%;
            border-radius: 2px;
            transition: all 0.3s;
            width: 0%;
        }

        .password-strength .bar.weak { width: 25%; background: var(--danger); }
        .password-strength .bar.medium { width: 50%; background: var(--warning); }
        .password-strength .bar.strong { width: 75%; background: var(--info); }
        .password-strength .bar.very-strong { width: 100%; background: var(--success); }

        .password-hint {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
        }

        .toast {
            background: rgba(13, 13, 21, 0.9);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .toast-success { border-left: 4px solid var(--success); }
        .toast-error { border-left: 4px solid var(--danger); }
        .toast-warning { border-left: 4px solid var(--warning); }
        .toast-info { border-left: 4px solid var(--info); }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-card { padding: 32px 24px; }
            .navbar-inner { padding: 0 20px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="navbar-logo" href="/">
                <i class="fas fa-cube"></i>
                <span>ProductKuu</span>
            </a>
            <div class="flex items-center gap-3">
                <a class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-sm font-semibold hover:bg-white/10 transition-all" href="/admin/login">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="logo-icon"><i class="fas fa-user-shield"></i></span>
                <h1>Register Admin</h1>
                <p class="subtitle">Buat akun administrator untuk mengelola ProductKuu</p>
                <div>
                    <span class="admin-badge"><i class="fas fa-lock text-[10px]"></i> Akses Terbatas</span>
                </div>
            </div>

            <!-- Error Message -->
            <div class="auth-error" id="authError">
                <i class="fas fa-exclamation-circle mt-1"></i>
                <div>
                    <span id="errorMessage">Terjadi kesalahan</span>
                    <div class="error-detail" id="errorDetail" style="font-size:11px;opacity:0.7;margin-top:4px;"></div>
                </div>
            </div>

            <!-- Success Message -->
            <div class="auth-success" id="authSuccess">
                <i class="fas fa-check-circle"></i>
                <div>
                    <strong id="successMessage">Akun berhasil dibuat!</strong>
                    <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">Mengarahkan ke halaman login...</p>
                </div>
            </div>

            <!-- Register Form -->
            <form id="registerForm">
                <div class="input-group">
                    <label for="fullName">Nama Lengkap</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input class="input" id="fullName" placeholder="Admin ProductKuu" required type="text">
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email Admin</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input class="input" id="email" placeholder="admin@productkuu.com" required type="email">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input class="input" id="password" placeholder="Minimal 6 karakter" required type="password">
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="bar" id="strengthBar"></div>
                    </div>
                    <div class="password-hint" id="passwordHint">Gunakan minimal 6 karakter dengan kombinasi huruf dan angka</div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Konfirmasi Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-check-circle"></i>
                        <input class="input" id="confirmPassword" placeholder="Masukkan ulang password" required type="password">
                    </div>
                </div>

                <div class="input-group" style="margin-bottom:24px;">
                    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                        <input type="checkbox" id="terms" required style="width:18px;height:18px;accent-color:#00dbe9;">
                        <span style="font-size:13px;font-weight:400;">
                            Saya setuju dengan 
                            <a href="#" style="color:var(--ice-blue);text-decoration:none;">Syarat & Ketentuan</a>
                        </span>
                    </label>
                </div>

                <button class="btn-primary" id="registerBtn" type="submit">
                    <i class="fas fa-user-plus"></i> Buat Akun Admin
                </button>
            </form>

            <div class="auth-divider">atau</div>

            <a class="btn-secondary" href="/admin/login">
                <i class="fas fa-sign-in-alt"></i> Sudah punya akun? Login
            </a>

            <div class="auth-footer">
                Kembali ke <a href="/">Beranda</a>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        // ============================================
        // IMPORTS
        // ============================================
        import { initializeApp } from "firebase/app";
        import { getAuth, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, doc, setDoc, serverTimestamp } from "firebase/firestore";

        console.log('📝 [ADMIN_REGISTER] Page loaded');

        // ============================================
        // FIREBASE CONFIG
        // ============================================
        // Gunakan config dari Android jika ada, atau fallback
        const firebaseConfig = window.FirebaseConfig || {
            apiKey: "AIzaSyA-6Tqd5i20sCMixQccI5p1sOCgQWN88dE",
            authDomain: "productkuu.firebaseapp.com",
            projectId: "productkuu",
            storageBucket: "productkuu.firebasestorage.app",
            messagingSenderId: "6615996108",
            appId: "1:6615996108:web:daa6e17c1275d3061cd469",
            measurementId: "G-78ZPLZMFEJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log('✅ [ADMIN_REGISTER] Firebase initialized');

        // ============================================
        // TOAST
        // ============================================
        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info}" style="font-size:20px;"></i>
                <div style="flex:1;font-size:14px;">${message}</div>
                <button onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:16px;">
                    <i class="fas fa-times"></i>
                </button>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 5000);
        }
        window.showToast = showToast;

        // ============================================
        // CHECK LOGIN STATUS
        // ============================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // Cek apakah user sudah admin
                    const userRef = doc(db, 'users', user.uid);
                    // Redirect ke dashboard
                    window.location.href = '/admin/dashboard';
                } catch (error) {
                    console.error('Error checking user:', error);
                }
            }
        });

        // ============================================
        // PASSWORD STRENGTH
        // ============================================
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');
        const passwordHint = document.getElementById('passwordHint');

        passwordInput.addEventListener('input', function() {
            const value = this.value;
            let strength = 0;
            
            if (value.length >= 6) strength++;
            if (value.length >= 10) strength++;
            if (/[A-Z]/.test(value) && /[a-z]/.test(value)) strength++;
            if (/\d/.test(value)) strength++;
            if (/[^A-Za-z0-9]/.test(value)) strength++;

            const levels = ['weak', 'medium', 'strong', 'very-strong'];
            const hints = [
                'Gunakan minimal 6 karakter dengan huruf dan angka',
                'Kombinasikan huruf besar dan kecil',
                'Tambahkan angka untuk keamanan lebih',
                'Tambahkan karakter khusus untuk keamanan maksimal'
            ];

            if (value.length === 0) {
                strengthBar.className = 'bar';
                strengthBar.style.width = '0%';
                passwordHint.textContent = 'Gunakan minimal 6 karakter dengan kombinasi huruf dan angka';
                passwordHint.style.color = 'var(--text-secondary)';
                return;
            }

            const index = Math.min(strength, 4) - 1;
            if (index >= 0) {
                strengthBar.className = `bar ${levels[index]}`;
                strengthBar.style.width = `${(strength / 4) * 100}%`;
                passwordHint.textContent = hints[index] || 'Password kuat!';
                passwordHint.style.color = strength >= 4 ? 'var(--success)' : 'var(--text-secondary)';
            }
        });

        // ============================================
        // REGISTER FORM
        // ============================================
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('📤 [ADMIN_REGISTER] Form submitted');

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            const errorEl = document.getElementById('authError');
            const errorMsg = document.getElementById('errorMessage');
            const errorDetail = document.getElementById('errorDetail');
            const successEl = document.getElementById('authSuccess');
            
            errorEl.classList.remove('show');
            successEl.classList.remove('show');

            // Validasi
            if (!fullName) {
                showToast('warning', 'Nama lengkap wajib diisi');
                return;
            }
            if (!email) {
                showToast('warning', 'Email wajib diisi');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showToast('warning', 'Format email tidak valid');
                return;
            }
            if (!password || password.length < 6) {
                showToast('warning', 'Password minimal 6 karakter');
                return;
            }
            if (password !== confirmPassword) {
                showToast('warning', 'Password tidak cocok');
                return;
            }
            if (!terms) {
                showToast('warning', 'Anda harus menyetujui syarat & ketentuan');
                return;
            }

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Membuat akun...';

            try {
                console.log('🔐 [ADMIN_REGISTER] Creating admin account...');
                
                // Create user
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                console.log('✅ [ADMIN_REGISTER] User created:', user.uid);

                // Update profile
                await updateProfile(user, { displayName: fullName });
                console.log('✅ [ADMIN_REGISTER] Profile updated');

                // Save user data as ADMIN
                await setDoc(doc(db, 'users', user.uid), {
                    uid: user.uid,
                    email: email,
                    displayName: fullName,
                    role: 'admin',
                    status: 'active',
                    verified: true,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });
                console.log('✅ [ADMIN_REGISTER] Admin data saved');

                // Show success
                successEl.classList.add('show');
                document.getElementById('successMessage').textContent = `🎉 Selamat ${fullName}! Akun Admin berhasil dibuat!`;
                
                showToast('success', '✅ Akun Admin berhasil dibuat!');

                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = '/admin/login';
                }, 2500);

            } catch (error) {
                console.error('❌ [ADMIN_REGISTER] Error:', error);
                
                let message = 'Gagal membuat akun. Silakan coba lagi.';
                let detail = `Error code: ${error.code}`;

                switch (error.code) {
                    case 'auth/email-already-in-use':
                        message = 'Email sudah terdaftar. Silakan gunakan email lain.';
                        detail = 'Email already registered';
                        break;
                    case 'auth/weak-password':
                        message = 'Password terlalu lemah. Gunakan minimal 6 karakter dengan kombinasi.';
                        detail = 'Weak password';
                        break;
                    case 'auth/invalid-email':
                        message = 'Format email tidak valid.';
                        detail = 'Invalid email format';
                        break;
                    case 'auth/network-request-failed':
                        message = 'Koneksi internet bermasalah. Periksa koneksi Anda.';
                        detail = 'Network error';
                        break;
                    case 'auth/too-many-requests':
                        message = 'Terlalu banyak percobaan. Coba lagi nanti.';
                        detail = 'Too many requests';
                        break;
                    default:
                        message = error.message || 'Gagal membuat akun.';
                        detail = `Error: ${error.code}`;
                }

                errorMsg.textContent = message;
                errorDetail.textContent = detail;
                errorEl.classList.add('show');
                showToast('error', message);

            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Buat Akun Admin';
            }
        });
